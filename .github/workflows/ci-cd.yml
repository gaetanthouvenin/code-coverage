# ------------------------------------------------------------------------------------------------
# CodeCoverage - CI/CD Pipeline (CONVENTIONS.md §14,ARCHITECTURE.md §12.8)
# GitVersion -> Build/Test (Testcontainers PostgreSQL and SQL Server) -> Compose smoke test
#            -> Docker images Api and Web, pushed to GHCR (main and v* tags only)
#            -> GitHub release of a v* tag: the uploader binaries and their .sha256, extracted from the
#               Api image of the tag (M4.01)
#            -> dotnet tool CodeCoverage.Uploader: packed and installed on every run, published to
#               nuget.org on a v* tag when NUGET_PUBLISH is true, by trusted publishing (M5.03)
#            -> deployment of a v* tag to the production host (M4.02b): job deploy, on the self-hosted
#               runner labelled cc-production, in the environment production (required reviewer), by
#               scripts/Deploy-Production.ps1; never on a pull request
# GitFlow (CONVENTIONS.md §15): work lands on develop through feature/* pull requests; main only
# receives releases and hotfixes, so only a release publishes images. Elsewhere the compose smoke
# test already builds both images from the Dockerfiles, so the image job does not run; it checks the
# uploader binaries the release would extract from the Api image it built.
# ------------------------------------------------------------------------------------------------
name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the run in progress; main, develop and tags always finish.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOLUTION: CodeCoverage.slnx
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/code-coverage
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  gitversion:
    name: GitVersion
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gv.outputs.semVer }}
      # GitVersion 6.x removed the NuGetVersion variable; SemVer is its replacement.
      nuget_version: ${{ steps.gv.outputs.semVer }}
      assembly_semver: ${{ steps.gv.outputs.assemblySemVer }}
      major_minor_patch: ${{ steps.gv.outputs.majorMinorPatch }}
      informational_version: ${{ steps.gv.outputs.informationalVersion }}
      pre_release: ${{ steps.gv.outputs.preReleaseTag }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.x"

      - id: gv
        uses: gittools/actions/gitversion/execute@v4
        with:
          configFilePath: GitVersion.yml

      - run: |
          echo "## Version: ${{ steps.gv.outputs.semVer }}" >> $GITHUB_STEP_SUMMARY

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: gitversion

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No private NuGet feed: the solution depends on nuget.org packages only (ARCHITECTURE.md
      # §12.1).
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: |
          dotnet build ${{ env.SOLUTION }} \
            --no-restore \
            --configuration Release \
            -p:NuGetVersion=${{ needs.gitversion.outputs.nuget_version }} \
            -p:AssemblySemVer=${{ needs.gitversion.outputs.assembly_semver }} \
            -p:MajorMinorPatch=${{ needs.gitversion.outputs.major_minor_patch }} \
            -p:InformationalVersion=${{ needs.gitversion.outputs.informational_version }}

      # The database tests start PostgreSQL and SQL Server through Testcontainers: the Docker engine
      # preinstalled on the ubuntu runners is enough, no service container is declared. They are
      # skipped (never failed) only where Docker is missing, which is not the case here.
      - name: Test
        run: |
          dotnet test ${{ env.SOLUTION }} \
            --no-build \
            --configuration Release \
            --logger "trx" \
            --results-directory TestResults

      # The parity tool (tools/parity, M4.06), on its synthetic answers of both APIs: no network, and
      # neither the Codecov API nor an instance is ever called.
      - name: Parity tool on its frozen sample
        shell: pwsh
        run: ./tools/parity/Test-CompareWithCodecov.ps1

      # The Prometheus alert rules of deploy/observability (M4.04), checked and unit tested by promtool
      # from the Prometheus image pinned by digest (prom/prometheus:v3.5.0).
      - name: Prometheus alert rules (promtool)
        run: |
          image=prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/rules:ro" -w /rules "$image" check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability:/rules:ro" -w /rules "$image" test rules alerts.test.yml

      # The rollout scripts (tools/rollout) against a local listener and synthetic values: no network,
      # no real token.
      - name: Rollout scripts on their offline self-test
        shell: pwsh
        run: ./tools/rollout/Test-Rollout.ps1

      # The deployment script of the production host (M4.02b) against fake docker and curl commands, and
      # the pre-job hook of its runner against the environments of accepted and refused jobs: no Docker,
      # no network.
      - name: Deployment script on its offline self-test
        shell: pwsh
        run: ./scripts/Test-DeployProduction.ps1

      - name: Runner pre-job hook on its offline self-test
        run: sh deploy/vm/runner/test-job-started.sh

      # The Azure template (pipelines/templates, M5.02): its script runs against a local fake release of
      # the uploader published from the sources; no network beyond localhost, no real token.
      - name: Azure template on its offline self-test
        shell: pwsh
        run: ./pipelines/tests/Test-CoverageUploadTemplate.ps1

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v6

      # Builds both images from the working tree, then starts docker-compose.yml on PostgreSQL and
      # with docker-compose.sqlserver.yml on SQL Server: both hosts ready, Swagger served, non-root
      # containers. Throwaway passwords and Data Protection certificate, stack removed afterwards.
      - name: Smoke test (PostgreSQL and SQL Server)
        shell: pwsh
        run: ./scripts/smoke-compose.ps1 -Provider All

      # The dry run of the release (M4.01): the uploader binaries are copied out of the Api image the
      # smoke test built, as the release job copies them out of the pushed image, and each one is
      # checked against its .sha256.
      - name: Uploader binaries of the Api image (release dry run)
        shell: pwsh
        run: ./scripts/Export-Uploader.ps1 -Image code-coverage-api:smoke -Destination artifacts/uploader

  docker:
    name: Docker image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [gitversion, build-and-test, compose-smoke]
    # Releases only (main and v* tags): never on develop nor a pull request, where compose-smoke has
    # already built both images. The env context is not available in a job condition.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Only this job pushes to GHCR, so only this job gets a package-write token.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.gitversion.outputs.semver }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            NUGET_VERSION=${{ needs.gitversion.outputs.nuget_version }}
            ASSEMBLY_SEMVER=${{ needs.gitversion.outputs.assembly_semver }}
            MAJOR_MINOR_PATCH=${{ needs.gitversion.outputs.major_minor_patch }}
            INFORMATIONAL_VERSION=${{ needs.gitversion.outputs.informational_version }}

  # The GitHub release of a v* tag (M4.01). Its files are copied out of the Api image the docker job
  # pushed for the same tag, never built a second time: they are those the instance serves on
  # /api/v1/uploader/{rid}. Only docker and gh, which the runner provides: no third-party action
  # holds the write token. Every value reaches the scripts through env:.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [gitversion, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read

    steps:
      - uses: actions/checkout@v6

      - name: Check that the tag is the version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          SEMVER: ${{ needs.gitversion.outputs.semver }}
        run: |
          if ($env:TAG -cne "v$env:SEMVER") {
            Write-Output "::error::The tag $env:TAG is not v$env:SEMVER, the version GitVersion computes."
            exit 1
          }

      - name: Copy the uploader out of the Api image of the tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-api:${{ needs.gitversion.outputs.semver }}
        run: |
          $env:GH_TOKEN | docker login ghcr.io --username $env:ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/Export-Uploader.ps1 -Image $env:IMAGE -Destination release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRE_RELEASE: ${{ needs.gitversion.outputs.pre_release }}
        run: |
          flags=(--verify-tag --title "$TAG" --generate-notes)
          if [ -n "$PRE_RELEASE" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* "${flags[@]}"

  # The deployment of a v* tag to the production host (M4.02b, docs/operations.md "Continuous
  # deployment"), pre-releases included. In this workflow so that the ref is the tag: the workflow, the
  # script and deploy/vm come from the commit of the tag, and its images and release already exist.
  # Never on a pull request. It runs on the self-hosted runner of the host, by its dedicated label only,
  # whose pre-job hook (deploy/vm/runner/job-started.sh) refuses any other job; the environment
  # production holds it until its reviewer approves (the wait does not count in timeout-minutes). A
  # redeployment is a "Re-run job" of the run of the tag; a return to an older version is the script
  # run by hand on the host with -AllowDowngrade and a restore. Every value reaches the steps through
  # env:, and the only action holds no token (persist-credentials: false).
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, cc-production]
    needs: [gitversion, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # PRODUCTION_URL, the https address of the Web, is a variable of the environment; unset, the run
    # shows no link and nothing else changes.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      # actions/checkout v6.1.0
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 0

      # Every docker command of the job uses a configuration of its own (DOCKER_CONFIG, on each step: the
      # runner context is not available in the env of a job), removed at the end, never the ~/.docker of
      # the runner user. The compose plugin must therefore be installed system-wide (cli-plugins of
      # /usr/libexec/docker or /usr/lib/docker, the apt docker-compose-plugin), not per user.
      - name: Check the tools of the host
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: |
          set -euo pipefail
          command -v pwsh >/dev/null || { echo "::error::pwsh 7.4+ is missing on the runner host."; exit 1; }
          pwsh -NoProfile -Command 'if ($PSVersionTable.PSVersion -lt [version]"7.4") { exit 1 }' \
            || { echo "::error::pwsh 7.4+ is required on the runner host."; exit 1; }
          compose=$(docker compose version --short 2>/dev/null) \
            || { echo "::error::The docker compose plugin is missing on the runner host (it must be installed system-wide)."; exit 1; }
          if [ "$(printf '2.24.0\n%s\n' "${compose#v}" | sort -V | head -1)" != "2.24.0" ]; then
            echo "::error::docker compose 2.24+ is required, the host has $compose."; exit 1
          fi
          command -v curl >/dev/null || { echo "::error::curl is missing on the runner host."; exit 1; }

      # A stable version comes from main; a pre-release from develop or a release/* branch.
      - name: Check where the tag comes from
        shell: bash
        env:
          SEMVER: ${{ needs.gitversion.outputs.semver }}
        run: |
          set -euo pipefail
          if [[ "$SEMVER" == *-* ]]; then
            refs=$(git for-each-ref --format='%(refname)' refs/remotes/origin/develop refs/remotes/origin/release/)
            allowed="origin/develop or a release/* branch"
          else
            refs=refs/remotes/origin/main
            allowed="origin/main"
          fi
          for ref in $refs; do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$ref"; then
              echo "The commit $GITHUB_SHA of $GITHUB_REF_NAME is on $ref."
              exit 0
            fi
          done
          echo "::error::The commit $GITHUB_SHA of $GITHUB_REF_NAME ($SEMVER) is not on $allowed: not deployed."
          exit 1

      - name: Log in to GHCR
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      # The SHA-256 of the linux-x64 uploader of the release is read first; the script compares it with
      # the one the deployed Api serves.
      - name: Deploy
        shell: pwsh
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER: ${{ needs.gitversion.outputs.semver }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if (-not $env:DEPLOY_DIR) {
            Write-Output "::error::Set the variable DEPLOY_DIR of the environment production."
            exit 1
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $release = Invoke-RestMethod -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG_NAME" -Headers $headers
          $asset = $release.assets | Where-Object name -eq 'coverage-upload-linux-x64.sha256' | Select-Object -First 1
          if (-not $asset) {
            Write-Output "::error::The release $env:TAG_NAME has no coverage-upload-linux-x64.sha256."
            exit 1
          }
          $response = Invoke-WebRequest -Uri $asset.url -Headers ($headers + @{ Accept = 'application/octet-stream' })
          $sum = if ($response.Content -is [byte[]]) { [System.Text.Encoding]::UTF8.GetString($response.Content) } else { "$($response.Content)" }
          ./scripts/Deploy-Production.ps1 -Version $env:SEMVER -Revision $env:GITHUB_SHA -Directory $env:DEPLOY_DIR -ExpectedUploaderSha256 $sum.Trim() -Execute

      # Never a logout without the configuration of the job: it would act on the ~/.docker of the user.
      - name: Log out of GHCR and clean up
        if: always()
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/docker
        run: |
          if [ -n "${DOCKER_CONFIG:-}" ]; then
            docker logout ghcr.io || true
            rm -rf "$DOCKER_CONFIG"
          fi
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete || true

  # The dotnet tool coverage-upload (M5.03), on every run: packed with the version of GitVersion,
  # installed from a local folder into an empty tool path, and run. The version of the package must
  # be the NuGet version of GitVersion (not --version, which carries +sha).
  nuget-tool:
    name: NuGet tool
    runs-on: ubuntu-latest
    needs: [gitversion, build-and-test]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Pack, install from a local folder, and run the tool
        shell: pwsh
        env:
          NUGET_VERSION: ${{ needs.gitversion.outputs.nuget_version }}
          ASSEMBLY_SEMVER: ${{ needs.gitversion.outputs.assembly_semver }}
          MAJOR_MINOR_PATCH: ${{ needs.gitversion.outputs.major_minor_patch }}
          INFORMATIONAL_VERSION: ${{ needs.gitversion.outputs.informational_version }}
        run: ./scripts/Test-UploaderTool.ps1 -Version $env:NUGET_VERSION -AssemblySemVer $env:ASSEMBLY_SEMVER -MajorMinorPatch $env:MAJOR_MINOR_PATCH -InformationalVersion $env:INFORMATIONAL_VERSION -Output nupkg

  # The publication to nuget.org (M5.03): on a v* tag only, once the GitHub release exists, and only
  # when the repository variable NUGET_PUBLISH is true (skipped otherwise). Trusted publishing: the OIDC
  # token of this job is exchanged for a short-lived nuget.org key (no long-lived key in the secrets);
  # NUGET_USER is the nuget.org account of the trusted publishing policy. No third-party action holds
  # the token: curl and dotnet only.
  nuget-publish:
    name: NuGet publication
    runs-on: ubuntu-latest
    needs: [gitversion, nuget-tool, release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.NUGET_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # Packed again from the same commit and version, as the nuget-tool job checked it: the build is
      # deterministic.
      - name: Pack the tool
        shell: pwsh
        env:
          NUGET_VERSION: ${{ needs.gitversion.outputs.nuget_version }}
          ASSEMBLY_SEMVER: ${{ needs.gitversion.outputs.assembly_semver }}
          MAJOR_MINOR_PATCH: ${{ needs.gitversion.outputs.major_minor_patch }}
          INFORMATIONAL_VERSION: ${{ needs.gitversion.outputs.informational_version }}
        run: ./scripts/Test-UploaderTool.ps1 -Version $env:NUGET_VERSION -AssemblySemVer $env:ASSEMBLY_SEMVER -MajorMinorPatch $env:MAJOR_MINOR_PATCH -InformationalVersion $env:INFORMATIONAL_VERSION -Output nupkg

      - name: Publish to nuget.org by trusted publishing
        shell: bash
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_USER:-}" ]; then echo "::error::Set the repository variable NUGET_USER."; exit 1; fi
          oidc=$(curl --fail --silent --show-error -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://www.nuget.org" | jq -r '.value')
          echo "::add-mask::$oidc"
          key=$(curl --fail --silent --show-error -X POST https://www.nuget.org/api/v2/token \
            -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
            -d "{\"username\":\"$NUGET_USER\",\"tokenType\":\"ApiKey\"}" | jq -r '.apiKey')
          echo "::add-mask::$key"
          dotnet nuget push "nupkg/*.nupkg" --api-key "$key" --source https://api.nuget.org/v3/index.json --skip-duplicate
