# docker-compose.yml — the full CodeCoverage stack on one machine: PostgreSQL, the Api
# (REST API and background job worker) and the Web (Blazor Server console). ARCHITECTURE.md §12.2.
#
# 1. Copy .env.example to .env and fill in DB_PASSWORD and DP_CERT_PASSWORD.
# 2. Create the Data Protection certificate (a self-signed development certificate is enough
#    locally; use a managed one in production):
#      pwsh scripts/new-dp-certificate.ps1 -Password "<DP_CERT_PASSWORD>"
# 3. Build and start:
#      docker compose up -d --build
#    or run the images published by the CI (IMAGE_PREFIX and TAG in .env):
#      docker compose up -d
#
# On SQL Server instead of PostgreSQL, add the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.sqlserver.yml up -d --build
#
# Both hosts are published on the loopback interface only: put a TLS reverse proxy in front of them
# (Caddyfile.example). The Api migrates the database at startup, the Web never does: the Web stays
# "not ready" (/health/ready) until the schema is up to date.
name: code-coverage

services:
  db:
    image: postgres:17-alpine
    # Not published: only the Api and the Web reach the database, over the compose network.
    environment:
      POSTGRES_DB: codecoverage
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d codecoverage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    # IMAGE_PREFIX: code-coverage for a local build, ghcr.io/<owner>/code-coverage for the CI images.
    image: ${IMAGE_PREFIX:-code-coverage}-api:${TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Bootstrap values only (ARCHITECTURE.md §4bis.2): every other setting is stored in the
      # database and edited in the web console. "CodeCoverage:Database:Provider" becomes
      # CodeCoverage__Database__Provider.
      ConnectionStrings__CodeCoverage: "Host=db;Port=5432;Database=codecoverage;Username=cc;Password=${DB_PASSWORD}"
      CodeCoverage__Database__Provider: PostgreSql
      CodeCoverage__Database__MigrateOnStartup: "true"
      Worker__Enabled: "true"
      # Swagger UI and Scalar are disabled in Production unless this is true.
      Features__EnableApiDocs: "${ENABLE_API_DOCS:-false}"
      # Addresses of the reverse proxy allowed to set X-Forwarded-For / X-Forwarded-Proto.
      ForwardedHeaders__KnownProxies: "${FORWARDED_KNOWN_PROXIES:-}"
      # Mandatory in Production: the host refuses to start with an unprotected key ring.
      DataProtection__CertificatePath: /run/secrets/dp.pfx
      DataProtection__CertificatePassword: "${DP_CERT_PASSWORD:?Set DP_CERT_PASSWORD in .env}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    secrets:
      - dp.pfx
    volumes:
      - api-data:/app/data
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    healthcheck:
      # The aspnet image has no curl: probe with bash's /dev/tcp and a raw HTTP request. Run through
      # bash explicitly: CMD-SHELL uses /bin/sh (dash), which has no /dev/tcp.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ${IMAGE_PREFIX:-code-coverage}-web:${TAG:-latest}
    # Deployed after the Api, which migrates the schema (ARCHITECTURE.md §12.4).
    depends_on:
      api:
        condition: service_started
    environment:
      ConnectionStrings__CodeCoverage: "Host=db;Port=5432;Database=codecoverage;Username=cc;Password=${DB_PASSWORD}"
      CodeCoverage__Database__Provider: PostgreSql
      # The same certificate as the Api: both hosts share the key ring stored in the database.
      DataProtection__CertificatePath: /run/secrets/dp.pfx
      DataProtection__CertificatePassword: "${DP_CERT_PASSWORD:?Set DP_CERT_PASSWORD in .env}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    secrets:
      - dp.pfx
    volumes:
      - web-data:/app/data
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

secrets:
  # Data Protection certificate (PKCS#12); scripts/new-dp-certificate.ps1 creates a development one.
  # Back it up separately from the database: without it, the stored secrets must be typed again.
  dp.pfx:
    file: ${DP_CERT_FILE:-./secrets/dp.pfx}

volumes:
  db: {}
  api-data: {}
  web-data: {}
