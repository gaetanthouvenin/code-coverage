<title>Coverage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: soft light-gray ground, white rounded cards, a pill top bar (no sidebar), black active pills, blue gradient as the
   brand accent (first KPI card, primary pill, gauge, selected bar). Coverage semantics stay green / amber / red. */
:root{
  --ground:#f1f2f6; --card:#ffffff; --card-2:#f4f5f8; --card-3:#e9ebf0;
  --line:#ebedf2; --line-2:#dfe2e9;
  --fg:#111318; --fg-2:#5d6372; --fg-3:#676d7c; --fg-4:#a2a7b3;
  --ink:#111318; --ink-hover:#2b2e36; --on-ink:#ffffff;
  --accent:#1f6bff; --accent-2:#7aaeff; --accent-soft:#e9f0ff; --accent-fg:#1a5ae0; --on-accent:#ffffff;
  --grad-a:#1747c9; --grad-b:#2f6df0; --on-accent-chip-bg:rgb(10 30 90 / .28);
  --orange:#f79009; --on-orange:#1a1204;
  --bar:#e3e5eb; --bar-track:#f5f6f9; --gauge-off:#eceef2; --thumb:#ffffff; --swatch-ring:#b6bbc6;
  --ok-bg:#e6f6ec; --ok-fg:#127a3e; --ok-solid:#1f9254;
  --warn-bg:#fdf2dc; --warn-fg:#935f07; --warn-solid:#d08a12;
  --err-bg:#fdebe9; --err-fg:#c0261c; --err-solid:#e0443a; --danger-solid:#c4281c;
  --info-bg:#e9f0ff; --info-fg:#1a5ae0;
  --neutral-bg:#f0f1f5; --neutral-fg:#4b5160;
  --hit:#e7f6ed; --hit-edge:#1f9254; --miss:#fdecea; --miss-edge:#e0443a; --part:#fdf4e1; --part-edge:#d08a12;
  --patch:#e3ecff;
  --chart-1:#1f6bff; --chart-2:#8b5cf6; --chart-3:#14a38f; --chart-grid:#e3e6ec; --chart-text:#676d7c;
  --tk-k:#7c3aed; --tk-t:#0e7490; --tk-s:#b45309;
  --code-bg:#f6f7fa;
  --scrim:rgb(17 19 24 / .45);
  --pop-shadow:0 24px 60px -20px rgb(17 19 24 / .30);
  --tip-shadow:0 10px 30px -8px rgb(17 19 24 / .14);
  --soft-shadow:0 1px 2px rgb(17 19 24 / .03);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  --r-xl:22px; --r-lg:18px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0c0e12; --card:#16191f; --card-2:#1f232b; --card-3:#2a2f39;
  --line:#242831; --line-2:#323843;
  --fg:#eef0f4; --fg-2:#9ba2ae; --fg-3:#8a919e; --fg-4:#656c79;
  --ink:#f2f3f6; --ink-hover:#ffffff; --on-ink:#111318;
  --accent:#3d7fff; --accent-2:#8fb9ff; --accent-soft:#18244a; --accent-fg:#8fb5ff; --on-accent:#ffffff;
  --grad-a:#1d4ed8; --grad-b:#2f6df0; --on-accent-chip-bg:rgb(0 0 0 / .30);
  --orange:#f59e0b; --on-orange:#1a1204;
  --bar:#2c313b; --bar-track:#1c2027; --gauge-off:#272c35; --thumb:#e6e9ee; --swatch-ring:#59606d;
  --ok-bg:#10291b; --ok-fg:#5fd38f; --ok-solid:#2fa865;
  --warn-bg:#2d2210; --warn-fg:#ebb65c; --warn-solid:#d99a2b;
  --err-bg:#331614; --err-fg:#f58a80; --err-solid:#e5544a; --danger-solid:#c93a30;
  --info-bg:#18244a; --info-fg:#8fb5ff;
  --neutral-bg:#23272f; --neutral-fg:#b9bfc9;
  --hit:#10261a; --hit-edge:#34b46b; --miss:#2f1513; --miss-edge:#e5564b; --part:#2c2210; --part-edge:#e0a23a;
  --patch:#1a2747;
  --chart-1:#5a92ff; --chart-2:#a78bfa; --chart-3:#2dd4bf; --chart-grid:#272c35; --chart-text:#8a919e;
  --tk-k:#c4b5fd; --tk-t:#67e8f9; --tk-s:#fcd34d;
  --code-bg:#12151a;
  --scrim:rgb(0 0 0 / .6);
  --pop-shadow:0 24px 60px -20px rgb(0 0 0 / .75);
  --tip-shadow:0 10px 30px -8px rgb(0 0 0 / .55);
  --soft-shadow:none;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0c0e12; --card:#16191f; --card-2:#1f232b; --card-3:#2a2f39;
  --line:#242831; --line-2:#323843;
  --fg:#eef0f4; --fg-2:#9ba2ae; --fg-3:#8a919e; --fg-4:#656c79;
  --ink:#f2f3f6; --ink-hover:#ffffff; --on-ink:#111318;
  --accent:#3d7fff; --accent-2:#8fb9ff; --accent-soft:#18244a; --accent-fg:#8fb5ff; --on-accent:#ffffff;
  --grad-a:#1d4ed8; --grad-b:#2f6df0; --on-accent-chip-bg:rgb(0 0 0 / .30);
  --orange:#f59e0b; --on-orange:#1a1204;
  --bar:#2c313b; --bar-track:#1c2027; --gauge-off:#272c35; --thumb:#e6e9ee; --swatch-ring:#59606d;
  --ok-bg:#10291b; --ok-fg:#5fd38f; --ok-solid:#2fa865;
  --warn-bg:#2d2210; --warn-fg:#ebb65c; --warn-solid:#d99a2b;
  --err-bg:#331614; --err-fg:#f58a80; --err-solid:#e5544a; --danger-solid:#c93a30;
  --info-bg:#18244a; --info-fg:#8fb5ff;
  --neutral-bg:#23272f; --neutral-fg:#b9bfc9;
  --hit:#10261a; --hit-edge:#34b46b; --miss:#2f1513; --miss-edge:#e5564b; --part:#2c2210; --part-edge:#e0a23a;
  --patch:#1a2747;
  --chart-1:#5a92ff; --chart-2:#a78bfa; --chart-3:#2dd4bf; --chart-grid:#272c35; --chart-text:#8a919e;
  --tk-k:#c4b5fd; --tk-t:#67e8f9; --tk-s:#fcd34d;
  --code-bg:#12151a;
  --scrim:rgb(0 0 0 / .6);
  --pop-shadow:0 24px 60px -20px rgb(0 0 0 / .75);
  --tip-shadow:0 10px 30px -8px rgb(0 0 0 / .55);
  --soft-shadow:none;
  color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--ground)}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--ground)}
a{color:var(--accent-fg);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
code,.mono{font-family:var(--mono);font-size:.85em}
.ic{width:1.15em;height:1.15em;flex-shrink:0;vertical-align:-.2em}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.muted{color:var(--fg-2)}.dim{color:var(--fg-3)}.small{font-size:12px}
.lnk{color:var(--fg);font-weight:600}.lnk:hover{color:var(--accent-fg);text-decoration:none}

/* ---- shell ---- */
.wrap{min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.frame{max-width:1360px;margin:0 auto}
@media (min-width:1100px){.wrap{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}
.top-wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;padding-block:20px 12px;background:var(--ground)}
.topbar{background:var(--card);border-radius:999px;min-height:70px;padding:10px 12px 10px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;box-shadow:var(--soft-shadow)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--fg);justify-self:start;min-width:0}
.brand:hover{text-decoration:none}
.brand-mark{width:40px;height:40px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.brand-mark i{width:3.5px;height:17px;border-radius:2px;display:block}
.nav-tabs{display:flex;gap:2px;background:var(--ground);border-radius:999px;padding:5px}
.nav-tabs a{padding:9px 17px;border-radius:999px;color:var(--fg);font-weight:500;white-space:nowrap}
.nav-tabs a:hover{background:var(--card);text-decoration:none}
.nav-tabs a.on{background:var(--ink);color:var(--on-ink)}
.top-right{display:flex;align-items:center;gap:8px;justify-self:end;min-width:0}
.round-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--fg);position:relative;flex-shrink:0}
.round-btn:hover{background:var(--card-2)}
.round-btn .ic{width:19px;height:19px}
.round-btn.sm{width:40px;height:40px}
.round-btn .pip{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--err-solid);box-shadow:0 0 0 2px var(--card)}
.icon-group{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--ground);flex-shrink:0}
.icon-group .round-btn{border:0;background:var(--card)}
.icon-group .round-btn:hover{background:var(--card-3)}
.user{display:flex;align-items:center;gap:10px;padding-left:6px;color:var(--fg);min-width:0}
.user:hover{text-decoration:none}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.who{min-width:0}
.who b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.who small{display:block;color:var(--fg-2);font-size:12.5px;line-height:1.25}
.menu-btn{display:none}
.mobile-nav{display:none;position:absolute;left:0;right:0;top:calc(100% - 2px);background:var(--card);border-radius:var(--r-xl);box-shadow:var(--pop-shadow);padding:10px;flex-direction:column;gap:2px;z-index:41}
.mobile-nav.open{display:flex}
.mobile-nav a{padding:12px 16px;border-radius:14px;color:var(--fg);font-weight:500}
.mobile-nav a:hover{background:var(--card-2);text-decoration:none}
.mobile-nav a.on{background:var(--ink);color:var(--on-ink)}
.strip{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);padding:2px 6px 0}
.strip .note{display:block;min-width:0;flex:1 1 260px;overflow-wrap:anywhere}
.strip .note .ic{margin-right:6px;vertical-align:-.25em}
.strip code{color:var(--fg)}
.page{display:flex;flex-direction:column;gap:32px;padding-top:28px}

/* ---- page header & pills ---- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding:4px 2px 0}
.ph-text{min-width:0;flex:1 1 380px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--fg-2);margin-bottom:6px}
.crumbs a{color:var(--fg-2)}
.crumbs .sep{color:var(--fg-4)}
.page-head h1{font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}
.page-head h1 .ic{width:26px;height:26px;color:var(--fg-2)}
.page-head h1 .path-title{font-family:var(--mono);font-size:17px;font-weight:500;letter-spacing:0;word-break:break-all}
.page-head p{margin-top:6px;color:var(--fg-2)}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px 0 6px;border-radius:999px;border:0;background:var(--card);color:var(--fg);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.pill:hover{background:var(--card-2);text-decoration:none}
.pill .round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card-2);flex-shrink:0}
.pill .round .ic{width:18px;height:18px}
.pill-primary,.panel .pill-primary{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:var(--on-accent)}
.pill-primary:hover,.panel .pill-primary:hover{background:linear-gradient(135deg,var(--grad-a),var(--grad-a))}
.pill-primary .round,.panel .pill-primary .round{background:color-mix(in srgb,var(--on-accent) 18%,transparent);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--on-accent) 80%,transparent)}
.pill-sel{position:relative;display:inline-flex;align-items:center;height:48px;border-radius:999px;background:var(--card);min-width:0;max-width:100%}
.pill-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-weight:500;height:100%;padding:0 52px 0 20px;cursor:pointer;border-radius:999px;max-width:100%;min-width:0}
.pill-sel select option{background:var(--card);color:var(--fg)}
.pill-sel .round{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:var(--card-2);display:grid;place-items:center;pointer-events:none}
.pill-sel .round .ic{width:17px;height:17px}
.pill.sm,.pill-sel.sm{height:42px}
.pill.sm .round,.pill-sel.sm .round{width:32px;height:32px}
.pill-sel.sm select{padding:0 46px 0 16px;font-size:13.5px}
.pill-sel .lead{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:grid;place-items:center;color:var(--fg-2);pointer-events:none}
.pill-sel .lead .ic{width:17px;height:17px}
.pill-sel.has-lead select{padding-left:40px}
.pill.static{cursor:default}
.pill.static:hover{background:var(--card)}
.pill.static .round{font-weight:700;font-variant-numeric:tabular-nums}
.pill-sel.xs{height:32px}
.pill-sel.xs select{padding:0 34px 0 12px;font-size:12px;color:var(--fg-2)}
.pill-sel.xs .round{width:24px;height:24px;right:4px;background:transparent}
.panel .pill,.panel .pill-sel{background:var(--card-2)}
.panel .pill:hover{background:var(--card-3)}
.panel .pill .round,.panel .pill-sel .round{background:var(--card)}
.search{position:relative;display:flex;align-items:center;flex:1 1 200px;min-width:0;max-width:300px}
.search .ic{position:absolute;left:16px;width:17px;height:17px;color:var(--fg-2);pointer-events:none}
.search input{height:44px;width:100%;border-radius:999px;border:1px solid transparent;background:var(--card);padding:0 16px 0 42px;font:inherit;color:var(--fg);min-width:0}
.panel .search input{background:var(--card);border-color:var(--line-2)}
.page-head .search input{height:48px}
.search input:focus{border-color:var(--accent);outline:none}
.search input::placeholder{color:var(--fg-3)}
.subtabs{display:flex;gap:2px;padding:5px;border-radius:999px;background:var(--card);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.subtabs a{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;color:var(--fg-2);font-weight:500;white-space:nowrap}
.subtabs a:hover{color:var(--fg);background:var(--card-2);text-decoration:none}
.subtabs a.on{background:var(--ink);color:var(--on-ink)}
.subtabs .ic{width:16px;height:16px}

/* ---- cards ---- */
.panel{background:var(--card);border-radius:var(--r-xl);min-width:0;box-shadow:var(--soft-shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:26px 28px 18px;flex-wrap:wrap}
.panel-head h2{font-size:19px;font-weight:600;letter-spacing:-.015em}
.panel-head .sub{color:var(--fg-2);font-size:13px}
.panel-head .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.panel-body{padding:28px}
.panel-head + .panel-body{padding-top:4px}
.panel-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 28px 24px}
.grid{display:grid;gap:24px}
.grid > *{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.stack{display:grid;gap:18px;align-content:start}

/* KPI */
.kpi{position:relative;background:var(--card);border-radius:var(--r-xl);padding:26px 26px 24px;display:flex;flex-direction:column;gap:10px;min-height:180px;min-width:0;box-shadow:var(--soft-shadow)}
.kpi .lbl{font-size:14px;color:var(--fg-2);font-weight:500;padding-right:54px;display:flex;align-items:center;gap:6px}
.kpi .kic{position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.kpi .kic .ic{width:20px;height:20px}
.kic.ink{background:var(--ink);color:var(--on-ink)}
.kic.grad{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:var(--on-accent)}
.kpi .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;min-width:0}
.kpi .val{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.kpi .foot{font-size:12.5px;color:var(--fg-2);margin-top:auto;padding-top:6px}
.kpi .row{margin-top:14px}
.kpi .foot b{color:var(--fg);font-weight:600}
.kpi.blue{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));color:var(--on-accent)}
.kpi.blue .lbl,.kpi.blue .foot,.kpi.blue .foot b,.kpi.blue code{color:var(--on-accent)}
.kpi.blue .kic{background:var(--on-accent);color:var(--grad-a)}
.chip{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--card-2);color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
.chip .arr{color:var(--ok-solid)}
.chip.down{background:var(--err-bg);color:var(--err-fg)}
.chip.down .arr{color:inherit}
.chip.orange{background:var(--orange);color:var(--on-orange)}
.chip.ink{background:var(--ink);color:var(--on-ink)}
.chip.orange .arr,.chip.ink .arr{color:inherit}
.kpi.blue .chip{background:var(--on-accent-chip-bg);color:var(--on-accent)}
.kpi.blue .chip .arr{color:inherit}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1.4;vertical-align:middle}
.badge .ic{width:13px;height:13px}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)}.b-warn{background:var(--warn-bg);color:var(--warn-fg)}.b-err{background:var(--err-bg);color:var(--err-fg)}
.b-info{background:var(--info-bg);color:var(--info-fg)}.b-neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
.delta-up{color:var(--ok-fg)}.delta-down{color:var(--err-fg)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--card-2);color:var(--fg);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card-3);text-decoration:none}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{background:var(--ink-hover)}
.btn-danger{background:var(--err-bg);color:var(--err-fg)}
.btn-danger:hover{background:var(--err-bg);box-shadow:inset 0 0 0 1px var(--err-fg)}
.btn-solid-danger{background:var(--danger-solid);color:var(--on-accent)}
.btn-solid-danger:hover{background:var(--danger-solid);filter:brightness(.92)}
.btn-sm{height:32px;padding:0 13px;font-size:12.5px}
.btn .ic{width:16px;height:16px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:13px;font-weight:600}
.input,.select{height:44px;border:1px solid transparent;border-radius:var(--r-md);background:var(--card-2);color:var(--fg);padding:0 14px;font:inherit;min-width:0;width:100%}
.input:focus,.select:focus{border-color:var(--accent);outline:none;background:var(--card)}
.input[readonly]{color:var(--fg-2);cursor:not-allowed}
.input:not(textarea){border-radius:999px;padding:0 16px}
.infield{position:relative;width:min(340px,100%)}
.list-row.set-row{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px 32px;align-items:center}
.set-ctrl{display:flex;align-items:center;gap:10px;min-width:0}

/* Segmented semicircular gauge: 16 rounded segments, strong blue -> light blue for the filled part, pale for the rest. */
function gauge(pct,caption){
  const N=16,cx=160,cy=156,r=116,on=Math.round(pct/100*N);let s='';
  for(let i=0;i<N;i++){const a=180-i*(180/(N-1));const t=on>1?i/(on-1):0;
    const fill=i<on?`color-mix(in srgb, var(--accent) ${Math.round(100-t*72)}%, var(--accent-2))`:'var(--gauge-off)';
    s+=`<rect x="${cx+r-20}" y="${cy-8.5}" width="40" height="17" rx="6" transform="rotate(${-a} ${cx} ${cy})" style="fill:${fill}"/>`}
  return `<svg class="gauge" viewBox="0 0 320 180" role="img" aria-label="${esc(caption)} : ${pct.toFixed(1)} %">${s}<text x="${cx}" y="${cy-12}" text-anchor="middle" font-size="40" font-weight="600" letter-spacing="-1.5" style="fill:var(--fg);font-variant-numeric:tabular-nums">${pct.toFixed(1)}%</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="12.5" style="fill:var(--fg-2)">${esc(caption)}</text></svg>`;
}
/* Bar chart: rounded bars on a pale track; the selected bar is blue + hatched with a dot and a floating tooltip. */
const CHARTS={};const BW=760,BH=290;
function barChart(id,cfg){
  CHARTS[id]=cfg;
  const L=46,R=6,T=22,B=34,n=cfg.values.length,max=cfg.max;
  const slot=(BW-L-R)/n,bw=Math.min(78,slot*.74);cfg._bw=bw;
  const y=v=>T+(1-v/max)*(BH-T-B);
  let g=`<defs><pattern id="hatch-${id}" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" style="fill:var(--accent)"/><rect width="3" height="8" style="fill:var(--accent-2);opacity:.6"/></pattern></defs>`;
  cfg.ticks.forEach(v=>{g+=`<line x1="${L}" x2="${BW-R}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="4 6" style="stroke:var(--chart-grid)"/><text x="${L-12}" y="${y(v)+4}" text-anchor="end" font-size="12" aria-hidden="true" style="fill:var(--chart-text)">${cfg.fmt(v)}</text>`});
  cfg.values.forEach((v,i)=>{
    const cx=L+slot*(i+.5),x=cx-bw/2,ty=y(cfg.track?cfg.track[i]:max),fy=Math.min(y(v),BH-B-10);
    const label=cfg.titles[i]+' : '+cfg.rows(i).map(([l,val])=>l+' '+val).join(', ');
    /* roving tabindex: only the selected bar is a tab stop, arrow keys move between bars */
    g+=`<g class="bar-g" data-i="${i}"><rect x="${x}" y="${ty}" width="${bw}" height="${BH-B-ty}" rx="14" style="fill:var(--bar-track)"/><rect class="fill" x="${x+4}" y="${fy}" width="${bw-8}" height="${BH-B-4-fy}" rx="11" style="fill:var(--bar)"/><text x="${cx}" y="${BH-10}" text-anchor="middle" font-size="12.5" font-weight="500" aria-hidden="true" style="fill:var(--fg-2)">${cfg.labels[i]}</text><rect class="bar-hit" data-chart="${id}" data-bar="${i}" x="${cx-slot/2}" y="${T}" width="${slot}" height="${BH-T-B}" fill="transparent" tabindex="${i===cfg.sel?0:-1}" role="button" aria-label="${esc(label)}"/></g>`;
  });
  g+=`<circle class="bar-dot" r="6" stroke-width="3" cx="-20" cy="-20" style="fill:var(--accent);stroke:var(--card)"/>`;
  return `<div class="chart-scroll"><div class="chart-box" id="chart-${id}"><svg viewBox="0 0 ${BW} ${BH}" role="group" aria-label="${esc(cfg.aria)}">${g}</svg><div class="tip" aria-hidden="true"></div></div></div>`;
}
function selectBar(id,i){
  const cfg=CHARTS[id],box=document.getElementById('chart-'+id);if(!cfg||!box)return;cfg.sel=i;
  box.querySelectorAll('.bar-g').forEach(g=>{const on=+g.dataset.i===i;g.classList.toggle('sel',on);g.querySelector('.fill').style.fill=on?`url(#hatch-${id})`:'var(--bar)';g.querySelector('.bar-hit').setAttribute('tabindex',on?'0':'-1')});
  const f=box.querySelector(`.bar-g[data-i="${i}"] .fill`);if(!f)return;
  const cx=+f.getAttribute('x')+(+f.getAttribute('width'))/2,cy=+f.getAttribute('y');
  const dot=box.querySelector('.bar-dot');dot.setAttribute('cx',cx);dot.setAttribute('cy',cy);
  const tip=box.querySelector('.tip');
  tip.innerHTML=`<strong>${esc(cfg.titles[i])}</strong>`+cfg.rows(i).map(([l,v,c,ring])=>`<div class="tr"><i class="${ring?'ring':''}" style="background:${c}"></i>${l}<b class="num">${v}</b></div>`).join('');
  const bw=box.clientWidth,bh=box.clientHeight,tw=tip.offsetWidth,th=tip.offsetHeight;
  const x=cx/BW*bw,yy=cy/BH*bh,half=(cfg._bw/2)/BW*bw+12;let left,top;
  if(yy-18-th>=0){left=Math.min(Math.max(x-tw/2,0),bw-tw);top=yy-18-th}
  else{top=Math.max(0,Math.min(yy-6,bh-th-30));left=(x+half+tw<=bw)?x+half:Math.max(0,x-half-tw)}
  tip.style.left=left+'px';tip.style.top=top+'px';
}
function lineChart(seriesList,opts){
  const W=760,H=250,L=46,R=70,T=14,B=30;const n=seriesList[0].values.length;
  const all=seriesList.flatMap(s=>s.values);let mn=Math.floor(Math.min(...all)/5)*5,mx=Math.ceil(Math.max(...all)/5)*5;if(mx-mn<10)mx=mn+10;
  const x=i=>L+i/(n-1)*(W-L-R),y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let g='';for(let v=mn;v<=mx;v+=5){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="4 6" style="stroke:var(--chart-grid)"/><text x="${L-12}" y="${y(v)+4}" text-anchor="end" font-size="12" style="fill:var(--chart-text)">${v}%</text>`}
  opts.labels.forEach(([i,t])=>{g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="500" style="fill:var(--fg-2)">${t}</text>`});
  if(opts.target!=null){g+=`<line x1="${L}" x2="${W-R}" y1="${y(opts.target)}" y2="${y(opts.target)}" stroke-dasharray="2 5" stroke-width="1.5" style="stroke:var(--fg-4)"/><text x="${W-R+14}" y="${y(opts.target)+4}" text-anchor="start" font-size="12" style="fill:var(--fg-2)">cible ${opts.target}%</text>`}
  seriesList.forEach((s,si)=>{const d=s.values.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    if(si===0)g+=`<path d="${d} L${x(n-1)} ${H-B} L${L} ${H-B}Z" style="fill:${s.color}" opacity=".08"/>`;
    g+=`<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="${si===0?2.6:1.8}" stroke-linecap="round" stroke-linejoin="round" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    g+=`<circle cx="${x(n-1)}" cy="${y(s.values[n-1])}" r="5" stroke-width="3" style="fill:${s.color};stroke:var(--card)"/>`});
  return `<div class="table-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px;display:block" role="img" aria-label="Historique de couverture">${g}</svg></div>`;
}

V['admin-params']=()=>{
  const srcB={db:'<span class="badge b-info">base</span>',env:'<span class="badge b-warn">environnement</span>',default:'<span class="badge b-neutral">défaut</span>'};
  const all=SETTINGS.flatMap(g=>g.items);

  kpis([

    {label:'Définis en base',icon:'layers',value:String(all.filter(s=>s.src==='db').length),chip:chipTxt('<span class="arr">↑</span>1','up'),foot:'Dernier changement : <b>07/11 18:41</b>'},
    {label:'Depuis l\'environnement',icon:'shield',value:String(all.filter(s=>s.src==='env').length),chip:chipTxt('lecture seule'),foot:'Priorité sur la base'},
    {label:'Redémarrage requis',icon:'refresh',value:String(all.filter(s=>s.restart).length),chip:chipTxt('Workers','down'),foot:'<code>Processing:WorkerConcurrency</code>'},
  ])+
  `<div class="banner banner-info">${ic('info')}<span>Ordre de priorité : ligne de commande &gt; variables d'environnement &gt; appsettings.json &gt; base. Une valeur venant de l'environnement est affichée en lecture seule.</span></div>
  ${SETTINGS.map(g=>`<div class="panel" data-setgroup><div class="panel-head"><h2>${g.group}</h2><span class="chip">${g.items.length} clé${g.items.length>1?'s':''}</span></div><div class="list">
    ${g.items.map(s=>{const id='set-'+s.k.replace(/[^a-z0-9]/gi,'-');let ctrl;
      if(s.secret)ctrl=`<span class="badge b-ok">${ic('check')}défini</span><button class="btn btn-sm" data-secret="${s.k}">Remplacer</button>`;
      else if(s.bool)ctrl=`<button class="switch ${s.v==='true'?'on':''}" data-switch aria-label="${s.k}" aria-pressed="${s.v}"></button>`;
      else{const acts=s.src==='env'?`<span class="infield-lock" title="Défini par l'environnement">${ic('shield')}</span>`:`<button class="infield-btn save" data-toast="Paramètre enregistré|${s.k} est appliqué sur l'Api et le Web." aria-label="Enregistrer ${s.k}" title="Enregistrer">${ic('check')}</button>${s.src==='db'?`<button class="infield-btn" data-toast="Valeur réinitialisée|Retour à la valeur par défaut." aria-label="Réinitialiser ${s.k}" title="Réinitialiser à la valeur par défaut">${ic('undo')}</button>`:''}`;
        ctrl=`<div class="infield ${s.src==='db'?'two':''}"><input class="input" id="${id}" value="${esc(s.v)}" ${s.src==='env'?'readonly':''} aria-label="${s.k}">${acts}</div>`}
      return `<div class="list-row set-row" data-key="${s.k.toLowerCase()}"><div class="grow"><code style="font-weight:600;color:var(--fg)">${s.k}</code> ${srcB[s.src]} ${s.restart?'<span class="badge b-warn">redémarrage requis</span>':''}${s.hint?`<div class="dim" style="font-size:12.5px;margin-top:2px">${esc(s.hint)}</div>`:''}</div><div class="set-ctrl">${ctrl}</div></div>`}).join('')}
  </div></div>`).join('')}`;
};

V.notfound=()=>`<div class="panel"><div class="empty"><span class="em-ic">${ic('search')}</span><h2>Introuvable ou inaccessible</h2><p style="max-width:440px">Ce dépôt n'existe pas, ou votre compte GitHub n'y a pas accès. Si vous venez d'obtenir l'accès, il apparaîtra d'ici 10 minutes.</p><p class="dim mono" style="font-size:12px">corrélation 0HN8V2K4QJ7M1:00000004</p><a class="pill pill-primary" href="#repos" style="margin-top:6px"><span class="round">${ic('repo')}</span>Retour aux dépôts</a></div></div>`;

V.login=()=>null;
function loginScreen(){return `<div class="login"><div class="login-card">
  <div class="login-hero"><span class="brand-mark" aria-hidden="true"><i style="background:var(--hit-edge)"></i><i style="background:var(--hit-edge)"></i><i style="background:var(--hit-edge)"></i><i style="background:var(--part-edge)"></i><i style="background:var(--miss-edge)"></i></span>
    <h1>Coverage</h1><p>Couverture de code des dépôts ${ORG}.</p></div>
  <div class="login-body">
    <button class="gh-btn" type="button" data-go="repos">${ic('github')}Se connecter avec GitHub</button>
    <p class="dim" style="font-size:12.5px">Vous ne verrez que les dépôts auxquels votre compte GitHub a accès.</p>
    <a href="#repos" style="font-size:12.5px">← revenir à la maquette</a>
    <p class="dim" style="font-size:11.5px">Maquette de design · données d'exemple · Route Blazor : <code>/signin</code></p></div></div></div>`}

/* ===================== Render & interactions ===================== */
function applyRepoFilter(){
  const rs=document.getElementById('repoSearch');const q=rs?rs.value.toLowerCase():'';
  const on=document.querySelector('[data-rf].on');const f=on?on.dataset.rf:'all';
  document.querySelectorAll('#repoRows tr').forEach(tr=>{const a=tr.dataset.active==='true';const okF=f==='all'||(f==='active'?a:!a);tr.hidden=!(okF&&tr.textContent.toLowerCase().includes(q))});
}
function render(){
  const id=current();const app=document.getElementById('app');
  if(id==='login'){app.innerHTML=loginScreen();window.scrollTo(0,0);return}
  app.innerHTML=shell(id,V[id]());
  window.scrollTo(0,0);
  if(id==='admin-tokens'){const pre=document.getElementById('ciSnippet');pre.textContent=CI.gha}
  app.querySelectorAll('.seg button').forEach(b=>{b.type='button';b.setAttribute('aria-pressed',String(b.classList.contains('on')))});
  Object.keys(CHARTS).forEach(k=>{if(document.getElementById('chart-'+k))selectBar(k,CHARTS[k].sel)});
}
function closeMenu(){const m=document.getElementById('mobileNav'),b=document.getElementById('menuBtn');if(m)m.classList.remove('open');if(b)b.setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{
  const bar=e.target.closest&&e.target.closest('[data-bar]');if(bar){selectBar(bar.dataset.chart,+bar.dataset.bar);return}
  const t=e.target.closest('button,a');
  if(!e.target.closest('#mobileNav')&&!(t&&t.id==='menuBtn'))closeMenu();
  if(!t)return;
  if(t.id==='menuBtn'){const m=document.getElementById('mobileNav');const open=m.classList.toggle('open');t.setAttribute('aria-expanded',String(open));return}
  if(t.id==='themeBtn'){document.documentElement.dataset.theme=isDark()?'light':'dark';t.innerHTML=ic(isDark()?'sun':'moon');t.setAttribute('aria-label',themeLabel());t.title=themeLabel();return}
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.closest('.seg')&&t.tagName==='BUTTON'){t.parentElement.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b===t);b.setAttribute('aria-pressed',String(b===t))});if(t.dataset.ci)document.getElementById('ciSnippet').textContent=CI[t.dataset.ci];if(t.dataset.rf)applyRepoFilter();return}
  if(t.hasAttribute('data-switch')){t.classList.toggle('on');t.setAttribute('aria-pressed',t.classList.contains('on'));toast('Modification enregistrée','Appliquée immédiatement.');return}
  if(t.hasAttribute('data-copy')){const pre=t.closest('.copy').querySelector('pre');copyText(pre.textContent,t);return}
  if(t.dataset.toast){const [a,b]=t.dataset.toast.split('|');toast(a,b);return}
  if(t.hasAttribute('data-revoke')){const row=t.closest('tr');const name=row.querySelector('strong').textContent;const o=modal(`<h2>Révoquer « ${esc(name)} » ?</h2><p class="muted">Les pipelines qui utilisent ce jeton ne pourront plus envoyer de couverture. Cette action est définitive.</p><div class="actions"><button class="btn" data-close>Annuler</button><button class="btn btn-solid-danger" id="doRevoke">Révoquer</button></div>`);o.querySelector('#doRevoke').onclick=()=>{const tb=row.parentElement;row.remove();o._ret=tb&&tb.closest('.panel')?tb.closest('.panel').querySelector('[data-revoke],button,a'):null;closeModal(o);toast('Jeton révoqué',name+' ne peut plus être utilisé.')};return}
  if(t.dataset.newtoken){const kind=t.dataset.newtoken;const o=modal(`<h2>Créer un jeton</h2><form class="field" id="tokForm"><label for="tokName">Nom</label><input class="input" id="tokName" value="${kind==='api'?'mon-script':'github-actions'}"></form><div class="actions"><button class="btn" data-close>Annuler</button><button class="btn btn-primary" id="doCreate">Créer</button></div>`);
    const done=()=>{o.querySelector('.modal').innerHTML=`<h2 id="mdlTitle">Jeton créé</h2><div class="banner banner-warn">${ic('alert')}<span>Copiez-le maintenant : il ne sera plus jamais affiché.</span></div><div class="copy"><pre class="code">vcc_${kind}_7Hq2LmX9pZr4TbW1nKc8VdE3sYf6</pre><button class="btn btn-sm" data-copy>${ic('copy')}Copier</button></div><div class="actions"><button class="btn btn-primary" data-close>J'ai copié le jeton</button></div>`;const f=o.querySelector('.modal [data-copy]');if(f)f.focus()};
    o.querySelector('#doCreate').onclick=done;o.querySelector('#tokForm').addEventListener('submit',ev=>{ev.preventDefault();done()});return}
  if(t.hasAttribute('data-import')){modal(`<h2>Importer un jeton Codecov</h2><p class="muted">Collez la valeur actuelle de <code>CODECOV_TOKEN</code>. Les pipelines continueront de fonctionner sans changer de secret. Seul un hachage est conservé.</p><div class="field"><label for="impTok">Valeur du jeton</label><input class="input" id="impTok" type="password" autocomplete="off" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div><div class="actions"><button class="btn" data-close>Annuler</button><button class="btn btn-primary" data-close data-toast="Jeton importé|Les uploads avec ce jeton sont acceptés.">Importer</button></div>`);return}
  if(t.dataset.secret){modal(`<h2>Remplacer ${esc(t.dataset.secret)}</h2><p class="muted">La valeur actuelle n'est jamais affichée. La nouvelle est chiffrée (Data Protection) puis appliquée à chaud.</p><div class="field"><label for="secVal">Nouvelle valeur</label><textarea class="input" id="secVal" style="height:120px;font-family:var(--mono);font-size:12px" placeholder="-----BEGIN RSA PRIVATE KEY-----"></textarea></div><div class="actions"><button class="btn" data-close>Annuler</button><button class="btn btn-primary" data-close data-toast="Secret remplacé|Enregistré et inscrit au journal d'audit.">Remplacer</button></div>`);return}
});
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('[data-bar]');if(b&&CHARTS[b.dataset.chart]&&CHARTS[b.dataset.chart].sel!==+b.dataset.bar)selectBar(b.dataset.chart,+b.dataset.bar)});
document.addEventListener('focusin',e=>{const b=e.target.closest&&e.target.closest('[data-bar]');if(b)selectBar(b.dataset.chart,+b.dataset.bar)});
document.addEventListener('keydown',e=>{
  const ov=document.querySelector('.overlay');
  if(e.key==='Escape'){if(ov)closeModal(ov);closeMenu();return}
  if(e.key==='Tab'&&ov){const fs=[...ov.querySelectorAll('button,a[href],input,textarea,select')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!fs.length)return;const first=fs[0],last=fs[fs.length-1];
    if(!ov.contains(document.activeElement)){e.preventDefault();first.focus()}else if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}
  const b=e.target.closest&&e.target.closest('[data-bar]');
  if(b&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();const n=CHARTS[b.dataset.chart].values.length;const i=(+b.dataset.bar+(e.key==='ArrowRight'?1:n-1))%n;const nx=document.querySelector(`#chart-${b.dataset.chart} [data-bar="${i}"]`);if(nx)nx.focus()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='repoSearch'){applyRepoFilter();return}
  if(el.dataset.filter){const q=el.value.toLowerCase();document.querySelectorAll('#'+el.dataset.filter+' tr').forEach(tr=>{tr.hidden=!tr.textContent.toLowerCase().includes(q)});return}
  if(el.hasAttribute('data-filter-settings')){const q=el.value.toLowerCase();document.querySelectorAll('[data-setgroup]').forEach(p=>{let any=false;p.querySelectorAll('[data-key]').forEach(r=>{const m=r.dataset.key.includes(q);r.hidden=!m;if(m)any=true});p.hidden=!any})}
});
document.addEventListener('change',e=>{
  if(e.target.id==='screenPick'){location.hash=e.target.value;return}
  if(e.target.hasAttribute('data-all')){const tb=e.target.closest('table').querySelector('tbody');tb.querySelectorAll('.chk').forEach(c=>{if(!c.closest('tr').hidden)c.checked=e.target.checked})}
});
document.addEventListener('submit',e=>e.preventDefault());
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>Object.keys(CHARTS).forEach(k=>{if(document.getElementById('chart-'+k))selectBar(k,CHARTS[k].sel)}),120)});
window.addEventListener('hashchange',()=>{closeMenu();render()});
render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Object.keys(CHARTS).forEach(k=>{if(document.getElementById('chart-'+k))selectBar(k,CHARTS[k].sel)}));
})();
</script>
