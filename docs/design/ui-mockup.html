/* ------------------------------------------------------------------------------------------------
   Coverage UI components (Web/Components/Ui), transposed from the validated mockup
   (docs/design/ui-mockup.html). BEM naming, every class prefixed with cc-, colours and radii from
   tokens.css only. Soft light-gray ground, white rounded cards, a pill top bar (no sidebar), black
   active pills, the blue gradient as the brand accent; coverage semantics stay green, amber, red.
   ------------------------------------------------------------------------------------------------ */

/* ---- base ---- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  background: var(--cc-ground);
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--cc-ground);
  color: var(--cc-fg);
  font-family: var(--cc-font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--cc-accent-fg);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

button {
  font: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--cc-accent);
  outline-offset: 2px;
}

h1,
h2,
h3 {
  margin: 0;
  text-wrap: balance;
}

p {
  margin: 0;
}

code {
  font-family: var(--cc-mono);
  font-size: .85em;
}

[hidden] {
  display: none !important;
}

.cc-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.cc-mono {
  font-family: var(--cc-mono);
  font-size: .85em;
}

.cc-num {
  font-variant-numeric: tabular-nums;
}

.cc-muted {
  color: var(--cc-fg-2);
}

/* A themed block: data-theme="light" or "dark" on it forces its tokens (the /_ui gallery). */
.cc-theme-scope {
  background: var(--cc-ground);
  color: var(--cc-fg);
}

/* ---- icon (Icons/CcIcon) ---- */
.cc-icon {
  width: 1.15em;
  height: 1.15em;
  flex-shrink: 0;
  vertical-align: -.2em;
}

/* ---- layout primitives ---- */
.cc-panel {
  min-width: 0;
  border-radius: var(--cc-r-xl);
  background: var(--cc-card);
  box-shadow: var(--cc-soft-shadow);
}

.cc-panel__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 26px 28px 18px;
}

.cc-panel__title {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -.015em;
}

.cc-panel__body {
  padding: 28px;
}

.cc-panel__head + .cc-panel__body {
  padding-top: 4px;
}

.cc-grid {
  display: grid;
  gap: 24px;
}

.cc-grid > * {
  min-width: 0;
}

.cc-grid--4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.cc-grid--3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.cc-grid--2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.cc-stack {
  display: grid;
  align-content: start;
  gap: 18px;
}

.cc-cluster {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

/* ---- app shell (CcAppShell) ---- */
.cc-shell {
  min-height: 100vh;
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-block: 0 56px;
}

.cc-shell__frame {
  max-width: 1360px;
  margin: 0 auto;
}

.cc-shell__top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  padding-block: 20px 12px;
  background: var(--cc-ground);
}

.cc-shell__main {
  display: block;
  padding-top: 28px;
}

.cc-skip-link {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 70;
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--cc-ink);
  color: var(--cc-on-ink);
  font-weight: 600;
  transform: translateY(-200%);
}

.cc-skip-link:focus {
  transform: none;
  text-decoration: none;
}

/* ---- top navigation (CcTopNav) ---- */
.cc-topnav {
  position: relative;
}

.cc-topnav__bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  min-height: 70px;
  padding: 10px 12px 10px 18px;
  border-radius: 999px;
  background: var(--cc-card);
  box-shadow: var(--cc-soft-shadow);
}

.cc-topnav__brand {
  display: flex;
  align-items: center;
  gap: 11px;
  justify-self: start;
  min-width: 0;
  color: var(--cc-fg);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.02em;
}

.cc-topnav__brand:hover {
  text-decoration: none;
}

.cc-topnav__brand-mark {
  display: flex;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--cc-ink);
}

.cc-topnav__brand-bar {
  display: block;
  width: 3.5px;
  height: 17px;
  border-radius: 2px;
  background: var(--cc-hit-edge);
}

.cc-topnav__brand-bar--partial {
  background: var(--cc-part-edge);
}

.cc-topnav__brand-bar--miss {
  background: var(--cc-miss-edge);
}

.cc-topnav__tabs {
  display: flex;
  gap: 2px;
  padding: 5px;
  border-radius: 999px;
  background: var(--cc-ground);
}

.cc-topnav__tab {
  padding: 9px 17px;
  border-radius: 999px;
  color: var(--cc-fg);
  font-weight: 500;
  white-space: nowrap;
}

.cc-topnav__tab:hover {
  background: var(--cc-card);
  text-decoration: none;
}

.cc-topnav__tab--active,
.cc-topnav__tab--active:hover {
  background: var(--cc-ink);
  color: var(--cc-on-ink);
}

.cc-topnav__end {
  display: flex;
  align-items: center;
  gap: 8px;
  justify-self: end;
  min-width: 0;
}

.cc-topnav__icons {
  display: flex;
  flex-shrink: 0;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--cc-ground);
}

.cc-topnav__icons .cc-round-button {
  border: 0;
  background: var(--cc-card);
}

.cc-topnav__icons .cc-round-button:hover {
  background: var(--cc-card-3);
}

.cc-topnav__menu-button {
  display: none;
}

.cc-topnav__mobile {
  position: absolute;
  top: calc(100% - 2px);
  right: 0;
  left: 0;
  z-index: 41;
  display: none;
  flex-direction: column;
  gap: 2px;
  padding: 10px;
  border-radius: var(--cc-r-xl);
  background: var(--cc-card);
  box-shadow: var(--cc-pop-shadow);
}

.cc-topnav__mobile--open {
  display: flex;
}

.cc-topnav__mobile .cc-topnav__tab {
  padding: 12px 16px;
  border-radius: 14px;
}

.cc-topnav__mobile .cc-topnav__tab:hover {
  background: var(--cc-card-2);
}

.cc-topnav__mobile .cc-topnav__tab--active,
.cc-topnav__mobile .cc-topnav__tab--active:hover {
  background: var(--cc-ink);
}

.cc-round-button {
  position: relative;
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 1px solid var(--cc-line);
  border-radius: 50%;
  background: var(--cc-card);
  color: var(--cc-fg);
  cursor: pointer;
}

.cc-round-button:hover {
  background: var(--cc-card-2);
}

.cc-round-button .cc-icon {
  width: 19px;
  height: 19px;
}

/* ---- user menu (CcUserMenu) ---- */
.cc-user-menu {
  position: relative;
  min-width: 0;
}

.cc-user-menu__trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 0 0 0 6px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--cc-fg);
  text-align: left;
  cursor: pointer;
}

.cc-user-menu__trigger:hover {
  text-decoration: none;
}

.cc-user-menu__avatar {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cc-grad-a), var(--cc-grad-b));
  color: var(--cc-on-accent);
  font-size: 14px;
  font-weight: 700;
}

.cc-user-menu__who {
  min-width: 0;
}

.cc-user-menu__name {
  display: block;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.25;
}

.cc-user-menu__role {
  display: block;
  color: var(--cc-fg-2);
  font-size: 12.5px;
  line-height: 1.25;
}

.cc-user-menu__panel {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  z-index: 42;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 220px;
  padding: 10px;
  border-radius: var(--cc-r-lg);
  background: var(--cc-card);
  box-shadow: var(--cc-pop-shadow);
}

.cc-user-menu__panel a {
  padding: 10px 14px;
  border-radius: 12px;
  color: var(--cc-fg);
  font-weight: 500;
}

.cc-user-menu__panel a:hover {
  background: var(--cc-card-2);
  text-decoration: none;
}

/* ---- page container and header (CcPageContainer, CcHeader) ---- */
.cc-page {
  display: flex;
  flex-direction: column;
  gap: 32px;
}

.cc-header {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.cc-header__row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px 24px;
  padding: 4px 2px 0;
}

.cc-header__text {
  flex: 1 1 380px;
  min-width: 0;
}

.cc-breadcrumb {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
  color: var(--cc-fg-2);
  font-size: 12.5px;
}

.cc-breadcrumb a {
  color: var(--cc-fg-2);
}

.cc-breadcrumb__sep {
  color: var(--cc-fg-4);
}

.cc-header__title {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -.025em;
  overflow-wrap: anywhere;
}

.cc-header__title .cc-icon {
  width: 26px;
  height: 26px;
  color: var(--cc-fg-2);
}

.cc-header__subtitle {
  margin-top: 6px;
  color: var(--cc-fg-2);
}

.cc-header__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

/* ---- second-level tabs (CcPillTabs) ---- */
.cc-pill-tabs {
  display: flex;
  gap: 2px;
  width: max-content;
  max-width: 100%;
  padding: 5px;
  overflow-x: auto;
  border-radius: 999px;
  background: var(--cc-card);
  scrollbar-width: none;
}

.cc-pill-tabs__tab {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: 999px;
  color: var(--cc-fg-2);
  font-weight: 500;
  white-space: nowrap;
}

.cc-pill-tabs__tab:hover {
  background: var(--cc-card-2);
  color: var(--cc-fg);
  text-decoration: none;
}

.cc-pill-tabs__tab--active,
.cc-pill-tabs__tab--active:hover {
  background: var(--cc-ink);
  color: var(--cc-on-ink);
}

.cc-pill-tabs__tab .cc-icon {
  width: 16px;
  height: 16px;
}

/* ---- in-page tabs (CcFolderTabs) ---- */
.cc-folder-tabs {
  display: inline-flex;
  gap: 2px;
  max-width: 100%;
  padding: 4px;
  overflow-x: auto;
  border-radius: 999px;
  background: var(--cc-card-2);
  scrollbar-width: none;
}

.cc-folder-tabs__tab {
  height: 34px;
  padding: 0 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--cc-fg-2);
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
}

.cc-folder-tabs__tab:hover {
  color: var(--cc-fg);
}

.cc-folder-tabs__tab--active,
.cc-folder-tabs__tab--active:hover {
  background: var(--cc-ink);
  color: var(--cc-on-ink);
}

/* ---- KPI card (CcKpiCard) ---- */
.cc-kpi {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  min-height: 180px;
  padding: 26px 26px 24px;
  border-radius: var(--cc-r-xl);
  background: var(--cc-card);
  box-shadow: var(--cc-soft-shadow);
}

.cc-kpi__label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-right: 54px;
  color: var(--cc-fg-2);
  font-size: 14px;
  font-weight: 500;
}

.cc-kpi__icon {
  position: absolute;
  top: 22px;
  right: 22px;
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--cc-card-2);
  color: var(--cc-fg);
}

.cc-kpi__icon .cc-icon {
  width: 20px;
  height: 20px;
}

.cc-kpi__icon--ink {
  background: var(--cc-ink);
  color: var(--cc-on-ink);
}

.cc-kpi__icon--gradient {
  background: linear-gradient(135deg, var(--cc-grad-a), var(--cc-grad-b));
  color: var(--cc-on-accent);
}

.cc-kpi__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  min-width: 0;
  margin-top: 14px;
}

.cc-kpi__value {
  font-size: 32px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}

.cc-kpi__footer {
  margin-top: auto;
  padding-top: 6px;
  color: var(--cc-fg-2);
  font-size: 12.5px;
}

.cc-kpi__footer b {
  color: var(--cc-fg);
  font-weight: 600;
}

.cc-kpi--accent {
  background: linear-gradient(135deg, var(--cc-grad-a), var(--cc-grad-b));
  color: var(--cc-on-accent);
}

.cc-kpi--accent .cc-kpi__label,
.cc-kpi--accent .cc-kpi__footer,
.cc-kpi--accent .cc-kpi__footer b {
  color: var(--cc-on-accent);
}

.cc-kpi--accent .cc-kpi__icon {
  background: var(--cc-on-accent);
  color: var(--cc-grad-a);
}

.cc-kpi--accent .cc-badge--chip {
  background: var(--cc-on-accent-chip-bg);
  color: var(--cc-on-accent);
}

/* ---- badge and chip (CcBadge) ---- */
.cc-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  vertical-align: middle;
}

.cc-badge .cc-icon {
  width: 13px;
  height: 13px;
}

.cc-badge--neutral {
  background: var(--cc-neutral-bg);
  color: var(--cc-neutral-fg);
}

.cc-badge--info {
  background: var(--cc-info-bg);
  color: var(--cc-info-fg);
}

.cc-badge--success {
  background: var(--cc-ok-bg);
  color: var(--cc-ok-fg);
}

.cc-badge--warning {
  background: var(--cc-warn-bg);
  color: var(--cc-warn-fg);
}

.cc-badge--danger {
  background: var(--cc-err-bg);
  color: var(--cc-err-fg);
}

.cc-badge--chip {
  gap: 3px;
  height: 22px;
  padding: 0 8px;
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}

.cc-badge--chip.cc-badge--neutral {
  background: var(--cc-card-2);
  color: var(--cc-fg-2);
}

.cc-badge--chip.cc-badge--warning {
  background: var(--cc-orange);
  color: var(--cc-on-orange);
}

/* ---- buttons (CcButton) ---- */
.cc-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 40px;
  padding: 0 18px;
  border: 0;
  border-radius: 999px;
  background: var(--cc-card-2);
  color: var(--cc-fg);
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}

.cc-button:hover {
  background: var(--cc-card-3);
  text-decoration: none;
}

.cc-button .cc-icon {
  width: 16px;
  height: 16px;
}

.cc-button--primary {
  background: var(--cc-ink);
  color: var(--cc-on-ink);
}

.cc-button--primary:hover {
  background: var(--cc-ink-hover);
}

.cc-button--danger {
  background: var(--cc-err-bg);
  color: var(--cc-err-fg);
}

.cc-button--danger:hover {
  background: var(--cc-err-bg);
  box-shadow: inset 0 0 0 1px var(--cc-err-fg);
}

.cc-button--solid-danger {
  background: var(--cc-danger-solid);
  color: var(--cc-on-accent);
}

.cc-button--solid-danger:hover {
  background: var(--cc-danger-solid);
  filter: brightness(.92);
}

.cc-button--small {
  height: 32px;
  padding: 0 13px;
  font-size: 12.5px;
}

/* The pill buttons of the page headers: an icon in a round, then the label. */
.cc-button--pill {
  gap: 10px;
  height: 48px;
  padding: 0 20px 0 6px;
  background: var(--cc-card);
  font-size: 14px;
  font-weight: 500;
}

.cc-button--pill:hover {
  background: var(--cc-card-2);
}

.cc-button--pill-accent {
  gap: 10px;
  height: 48px;
  padding: 0 20px 0 6px;
  background: linear-gradient(135deg, var(--cc-grad-a), var(--cc-grad-b));
  color: var(--cc-on-accent);
  font-size: 14px;
  font-weight: 500;
}

.cc-button--pill-accent:hover {
  background: linear-gradient(135deg, var(--cc-grad-a), var(--cc-grad-a));
}

.cc-button__round {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--cc-card-2);
}

.cc-button__round .cc-icon {
  width: 18px;
  height: 18px;
}

.cc-button--pill-accent .cc-button__round {
  background: color-mix(in srgb, var(--cc-on-accent) 18%, transparent);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--cc-on-accent) 80%, transparent);
}

.cc-panel .cc-button--pill {
  background: var(--cc-card-2);
}

.cc-panel .cc-button--pill:hover {
  background: var(--cc-card-3);
}

.cc-panel .cc-button--pill .cc-button__round {
  background: var(--cc-card);
}

.cc-button[disabled],
.cc-button[aria-disabled="true"] {
  opacity: .45;
  cursor: not-allowed;
}

/* ---- banner (CcBanner) ---- */
.cc-banner {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--cc-r-lg);
  font-size: 13.5px;
}

.cc-banner__icon {
  width: 18px;
  height: 18px;
  margin-top: 1px;
}

.cc-banner__body {
  flex: 1;
  min-width: 0;
}

.cc-banner__title {
  display: block;
  font-weight: 600;
}

.cc-banner__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.cc-banner--neutral {
  background: var(--cc-neutral-bg);
  color: var(--cc-neutral-fg);
}

.cc-banner--info {
  background: var(--cc-info-bg);
  color: var(--cc-info-fg);
}

.cc-banner--success {
  background: var(--cc-ok-bg);
  color: var(--cc-ok-fg);
}

.cc-banner--warning {
  background: var(--cc-warn-bg);
  color: var(--cc-warn-fg);
}

.cc-banner--danger {
  background: var(--cc-err-bg);
  color: var(--cc-err-fg);
}

/* ---- empty state and error boundary (CcEmptyState, CcErrorBoundary) ---- */
.cc-empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 56px 16px;
  color: var(--cc-fg-2);
  text-align: center;
}

.cc-empty-state__icon {
  display: grid;
  place-items: center;
  width: 72px;
  height: 72px;
  margin-bottom: 6px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cc-grad-a), var(--cc-grad-b));
  color: var(--cc-on-accent);
}

.cc-empty-state__icon .cc-icon {
  width: 30px;
  height: 30px;
}

.cc-empty-state__title {
  color: var(--cc-fg);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -.02em;
}

.cc-empty-state__description {
  max-width: 440px;
}

.cc-empty-state__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 8px;
}

.cc-error-boundary .cc-empty-state__icon {
  background: var(--cc-err-bg);
  color: var(--cc-err-fg);
}

/* ---- loading spinner (CcLoadingSpinner) ---- */
.cc-spinner {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--cc-fg-2);
}

.cc-spinner__ring {
  width: 22px;
  height: 22px;
  border: 3px solid var(--cc-gauge-off);
  border-top-color: var(--cc-accent);
  border-radius: 50%;
  animation: cc-spin .8s linear infinite;
}

.cc-spinner--small .cc-spinner__ring {
  width: 16px;
  height: 16px;
  border-width: 2px;
}

.cc-spinner--large {
  flex-direction: column;
  padding: 40px 16px;
}

.cc-spinner--large .cc-spinner__ring {
  width: 40px;
  height: 40px;
  border-width: 4px;
}

@keyframes cc-spin {
  to {
    transform: rotate(360deg);
  }
}

/* ---- fields (CcTextField, CcSelectField) ---- */
.cc-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
  text-align: left;
}

.cc-field__label {
  font-size: 13px;
  font-weight: 600;
}

.cc-field__help {
  color: var(--cc-fg-2);
  font-size: 12.5px;
}

.cc-field__error {
  color: var(--cc-err-fg);
  font-size: 12.5px;
  font-weight: 500;
}

.cc-input {
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 16px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--cc-card-2);
  color: var(--cc-fg);
  font: inherit;
}

.cc-input:focus {
  border-color: var(--cc-accent);
  outline: none;
  background: var(--cc-card);
}

.cc-input:focus-visible {
  box-shadow: 0 0 0 3px var(--cc-accent-soft);
}

.cc-input[readonly] {
  color: var(--cc-fg-2);
  cursor: not-allowed;
}

.cc-input[disabled] {
  opacity: .55;
  cursor: not-allowed;
}

.cc-input--invalid,
.cc-input--invalid:focus {
  border-color: var(--cc-err-solid);
}

.cc-input::placeholder {
  color: var(--cc-fg-3);
}

.cc-select {
  position: relative;
  min-width: 0;
}

.cc-select__control {
  padding-right: 48px;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
}

.cc-select__control option {
  background: var(--cc-card);
  color: var(--cc-fg);
}

.cc-select__chevron {
  position: absolute;
  top: 50%;
  right: 6px;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--cc-card);
  pointer-events: none;
  transform: translateY(-50%);
}

.cc-select__chevron .cc-icon {
  width: 16px;
  height: 16px;
}

/* The pill select of the page headers and toolbars. */
.cc-select--pill .cc-select__control {
  height: 48px;
  padding: 0 52px 0 20px;
  background: var(--cc-card);
  font-weight: 500;
}

.cc-select--pill .cc-select__chevron {
  width: 36px;
  height: 36px;
  background: var(--cc-card-2);
}

.cc-select--lead .cc-select__control {
  padding-left: 40px;
}

.cc-select__lead {
  position: absolute;
  top: 50%;
  left: 14px;
  display: grid;
  place-items: center;
  color: var(--cc-fg-2);
  pointer-events: none;
  transform: translateY(-50%);
}

.cc-select__lead .cc-icon {
  width: 17px;
  height: 17px;
}

.cc-panel .cc-select--pill .cc-select__control {
  background: var(--cc-card-2);
}

.cc-panel .cc-select--pill .cc-select__chevron {
  background: var(--cc-card);
}

/* ---- search bar (CcSearchBar) ---- */
.cc-search {
  position: relative;
  display: flex;
  flex: 1 1 200px;
  align-items: center;
  min-width: 0;
  max-width: 300px;
}

.cc-search__icon {
  position: absolute;
  left: 16px;
  width: 17px;
  height: 17px;
  color: var(--cc-fg-2);
  pointer-events: none;
}

.cc-search__input {
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 16px 0 42px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--cc-card);
  color: var(--cc-fg);
  font: inherit;
}

.cc-search__input:focus {
  border-color: var(--cc-accent);
  outline: none;
}

.cc-search__input:focus-visible {
  box-shadow: 0 0 0 3px var(--cc-accent-soft);
}

.cc-search__input::placeholder {
  color: var(--cc-fg-3);
}

.cc-panel .cc-search__input {
  border-color: var(--cc-line-2);
}

.cc-header .cc-search__input {
  height: 48px;
}

/* ---- toasts (CcToast) ---- */
.cc-toasts {
  position: fixed;
  right: calc(16px + env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 60;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.cc-toast {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: min(380px, calc(100vw - 32px));
  padding: 14px 16px;
  border: 1px solid var(--cc-line);
  border-radius: var(--cc-r-lg);
  background: var(--cc-card);
  box-shadow: var(--cc-pop-shadow);
  animation: cc-toast-pop .2s ease;
}

.cc-toast__icon {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--cc-info-bg);
  color: var(--cc-info-fg);
}

.cc-toast__icon .cc-icon {
  width: 17px;
  height: 17px;
}

.cc-toast--neutral .cc-toast__icon {
  background: var(--cc-neutral-bg);
  color: var(--cc-neutral-fg);
}

.cc-toast--success .cc-toast__icon {
  background: var(--cc-ok-bg);
  color: var(--cc-ok-fg);
}

.cc-toast--warning .cc-toast__icon {
  background: var(--cc-warn-bg);
  color: var(--cc-warn-fg);
}

.cc-toast--danger .cc-toast__icon {
  background: var(--cc-err-bg);
  color: var(--cc-err-fg);
}

.cc-toast__body {
  flex: 1;
  min-width: 0;
}

.cc-toast__title {
  display: block;
  font-weight: 600;
}

.cc-toast__message {
  font-size: 13px;
  color: var(--cc-fg-2);
}

.cc-toast__close {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--cc-fg-3);
  cursor: pointer;
}

.cc-toast__close:hover {
  background: var(--cc-card-3);
  color: var(--cc-fg);
}

.cc-toast__close .cc-icon {
  width: 15px;
  height: 15px;
}

@keyframes cc-toast-pop {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

/* ---- motion ---- */
@media (prefers-reduced-motion: reduce) {
  .cc-spinner__ring {
    animation-duration: 2.4s;
  }

  .cc-toast {
    animation: none;
  }
}

/* ---- responsive ---- */
@media (min-width: 900px) {
  .cc-shell {
    padding-right: max(28px, env(safe-area-inset-right, 0px));
    padding-left: max(28px, env(safe-area-inset-left, 0px));
  }
}

@media (min-width: 1100px) {
  .cc-shell {
    padding-right: max(40px, env(safe-area-inset-right, 0px));
    padding-left: max(40px, env(safe-area-inset-left, 0px));
  }
}

@media (max-width: 1180px) {
  .cc-grid--4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 1040px) {
  .cc-topnav__bar {
    display: flex;
  }

  .cc-topnav__tabs {
    display: none;
  }

  .cc-topnav__end {
    margin-left: auto;
  }

  .cc-topnav__menu-button {
    display: grid;
  }
}

@media (min-width: 1041px) {
  .cc-topnav__mobile {
    display: none !important;
  }
}

@media (max-width: 900px) {
  .cc-grid--3,
  .cc-grid--2 {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 640px) {
  .cc-shell__top {
    padding-block: 10px 6px;
  }

  .cc-topnav__bar {
    gap: 8px;
    min-height: 60px;
    padding: 8px 8px 8px 10px;
  }

  .cc-user-menu__who {
    display: none;
  }

  .cc-user-menu__trigger {
    padding-left: 0;
  }

  .cc-round-button,
  .cc-user-menu__avatar {
    width: 40px;
    height: 40px;
  }

  .cc-topnav__brand {
    gap: 9px;
    font-size: 17px;
  }

  .cc-topnav__brand-mark {
    width: 38px;
    height: 38px;
  }

  .cc-header__title {
    font-size: 23px;
  }

  .cc-kpi__value {
    font-size: 28px;
  }

  .cc-panel__head {
    padding: 18px 16px 12px;
  }

  .cc-panel__body {
    padding: 16px;
  }

  .cc-search {
    max-width: none;
  }
}

@media (max-width: 600px) {
  .cc-grid--4 {
    grid-template-columns: minmax(0, 1fr);
  }

  .cc-grid {
    gap: 16px;
  }

  .cc-page {
    gap: 22px;
  }

  .cc-shell__main {
    padding-top: 16px;
  }

  .cc-kpi {
    min-height: 150px;
    padding: 20px;
  }
}

/* ------------------------------------------------------------------------------------------------
   Coverage application styles: what belongs to the pages of the product (Web/Components/Pages and
   Layout), not to the reusable components of components.css. Every class is prefixed with cc-;
   colours, radii and fonts come from tokens.css only, so the dark theme follows on its own.
   ------------------------------------------------------------------------------------------------ */

/* ---- status pages (Error, NotFound, AccessDenied) ---- */
.cc-status-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 28px 36px;
}

.cc-status-page .cc-empty-state {
  padding-bottom: 24px;
}

.cc-status-page__request {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  max-width: 100%;
  color: var(--cc-fg-3);
  font-size: 13px;
}

.cc-status-page__request-id {
  padding: 4px 10px;
  overflow-wrap: anywhere;
  border-radius: var(--cc-r-sm);
  background: var(--cc-code-bg);
  color: var(--cc-fg-2);
  font-family: var(--cc-mono);
  font-size: 12px;
}

@media (max-width: 640px) {
  .cc-status-page {
    padding: 12px 16px 28px;
  }
}

/* ------------------------------------------------------------------------------------------------
   What the console pages need beyond components.css. cc-* rules are candidates for components.css
   when the pages are built; cc-mock-* rules are the review bar of this mockup and never ship.
   ------------------------------------------------------------------------------------------------ */
.cc-panel__sub{margin-top:2px;color:var(--cc-fg-2);font-size:13px}
.cc-panel__tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.cc-panel__foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:8px 28px 24px}
.cc-grid--main{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.cc-stack>*{min-width:0}
.cc-table:has(tbody[id^="home-"]){min-width:820px;table-layout:fixed}
.cc-table:has(tbody[id^="home-"]) th:first-child{width:30%}
.cc-table-wrap{overflow-x:auto}
.cc-panel>.cc-table-wrap{padding:0 18px 18px}
.cc-panel>.cc-table-wrap:first-child{padding-top:18px}
.cc-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.cc-table th{padding:13px 16px;background:var(--cc-card-2);color:var(--cc-fg-2);font-size:13px;font-weight:500;text-align:left;white-space:nowrap}
.cc-table th:first-child{border-radius:12px 0 0 12px}

function table(cols,rows,id){return `<div class="cc-table-wrap"><table class="cc-table"><thead><tr>${cols.map(c=>{const[l,r]=Array.isArray(c)?c:[c];return `<th class="${r?'cc-r':''}">${l}</th>`}).join('')}</tr></thead><tbody ${id?`id="${id}"`:''}>${rows.join('')}</tbody></table></div>`}

function covbar(h,p,m){const n=h+p+m;const v=h/n*100;return `<div class="cc-covbar"><div class="cc-covbar__track" aria-hidden="true"><span class="cc-covbar__h" style="width:${h/n*100}%"></span><span class="cc-covbar__p" style="width:${p/n*100}%"></span><span class="cc-covbar__m" style="width:${m/n*100}%"></span></div><span class="cc-num cc-strong">${pct(v,1)}</span></div>`}

const COMMIT_BADGE={Complete:()=>badge('success',t('Commit_Complete'),'check'),Pending:()=>badge('info',t('Commit_Pending'),'clock'),Error:()=>badge('danger',t('Commit_Error'),'alert')};

function badgeSvg(v){const col=v>=80?'#4c1':v>=70?'#a3c51c':v>=60?'#dfb317':'#e05d44';const txt=Math.round(v)+'%';return `<svg xmlns="http://www.w3.org/2000/svg" width="104" height="20" role="img" aria-label="${SHIELD_LABEL}: ${txt}"><rect width="62" height="20" rx="3" fill="#555"/><rect x="60" width="44" height="20" rx="3" fill="${col}"/><rect x="60" width="4" height="20" fill="${col}"/><g fill="#fff" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle"><text x="31" y="14">${SHIELD_LABEL}</text><text x="82" y="14">${txt}</text></g></svg>`}

/* ===================== Charts ===================== */
function spark(vals,w=110,h=30){const mn=Math.min(...vals)-.2,mx=Math.max(...vals)+.2;const x=i=>i/(vals.length-1)*(w-8)+2,y=v=>h-3-(v-mn)/(mx-mn)*(h-6);const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join('');const last=vals.length-1;return `<svg class="cc-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${tr('30-day trend','Tendance sur 30 jours')}"><path d="${d}L${x(last).toFixed(1)} ${h}L2 ${h}Z" style="fill:var(--cc-accent-soft)"/><path d="${d}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--cc-accent)"/><circle cx="${x(last)}" cy="${y(vals[last])}" r="3" style="fill:var(--cc-accent);stroke:var(--cc-card)" stroke-width="1.5"/></svg>`}
function gauge(v,caption){const N=16,cx=160,cy=156,r=116,on=Math.round(v/100*N);let s='';for(let i=0;i<N;i++){const a=180-i*(180/(N-1));const k=on>1?i/(on-1):0;const fill=i<on?`color-mix(in srgb, var(--cc-accent) ${Math.round(100-k*72)}%, var(--cc-accent-2))`:'var(--cc-gauge-off)';s+=`<rect x="${cx+r-20}" y="${cy-8.5}" width="40" height="17" rx="6" transform="rotate(${-a} ${cx} ${cy})" style="fill:${fill}"/>`}return `<svg class="cc-gauge" viewBox="0 0 320 180" role="img" aria-label="${esc(caption)}: ${pct(v,1)}">${s}<text x="${cx}" y="${cy-12}" text-anchor="middle" font-size="38" font-weight="600" letter-spacing="-1.5" style="fill:var(--cc-fg);font-variant-numeric:tabular-nums">${pct(v,1)}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="12.5" style="fill:var(--cc-fg-2)">${esc(caption)}</text></svg>`}
/* Line chart: one series per flag, 2px lines, direct labels and a dash pattern for each series, so a series is never told apart by colour alone. */
const CHART_SERIES=[{c:'var(--cc-chart-1)',dash:''},{c:'var(--cc-chart-3)',dash:'7 4'},{c:'var(--cc-chart-2)',dash:'2 4'}];
let chartData=null;
function lineChart(list,days){const W=Math.max(400,Math.min(1260,(window.innerWidth||1400)-60)),H=W<800?260:300,L=W<640?34:46,R=W<640?100:130,TP=14,B=30;const n=list[0].values.length;const all=list.flatMap(s=>s.values);let mn=Math.floor(Math.min(...all)/5)*5,mx=Math.ceil(Math.max(...all)/5)*5;if(mx-mn<10)mx=mn+10;const x=i=>L+i/(n-1)*(W-L-R),y=v=>TP+(1-(v-mn)/(mx-mn))*(H-TP-B);let g='';for(let v=mn;v<=mx;v+=5){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke-dasharray="3 5" style="stroke:var(--cc-chart-grid)"/><text x="${L-10}" y="${y(v)+4}" text-anchor="end" font-size="12" style="fill:var(--cc-chart-text)">${v}</text>`}
  const dayLabel=i=>S.lang==='fr'?`J−${days-1-Math.round(i/(n-1)*(days-1))}`:`D−${days-1-Math.round(i/(n-1)*(days-1))}`;
  [0,Math.round((n-1)/2),n-1].forEach(i=>{g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" style="fill:var(--cc-chart-text)">${i===n-1?tr('Today','Aujourd’hui'):dayLabel(i)}</text>`});
  const ends=list.map((s,i)=>({i,y:y(s.values[n-1])})).sort((a,b)=>a.y-b.y);for(let k=1;k<ends.length;k++)if(ends[k].y-ends[k-1].y<15)ends[k].y=ends[k-1].y+15;
  list.forEach((s,i)=>{const d=s.values.map((v,j)=>(j?'L':'M')+x(j).toFixed(1)+' '+y(v).toFixed(1)).join('');const st=CHART_SERIES[i];const ly=ends.find(e=>e.i===i).y;g+=`<g data-series="${esc(s.label)}"><path d="${d}" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${st.dash}" style="stroke:${st.c}"/><circle cx="${x(n-1)}" cy="${y(s.values[n-1])}" r="4" stroke-width="2" style="fill:${st.c};stroke:var(--cc-card)"/><text x="${x(n-1)+10}" y="${ly+4}" font-size="12" font-weight="600" style="fill:var(--cc-fg-2)">${esc(s.label)} ${nf(s.values[n-1],1)}</text></g>`});
  g+=`<line id="cc-cross" x1="0" x2="0" y1="${TP}" y2="${H-B}" stroke-width="1" visibility="hidden" style="stroke:var(--cc-fg-3)"/><rect id="cc-hit" x="${L}" y="${TP}" width="${W-L-R}" height="${H-TP-B}" fill="transparent"/>`;
  chartData={list,n,x,W,L,R,dayLabel};
  const label=tr('Coverage history','Historique de couverture')+': '+list.map(s=>`${s.label} ${pct(s.values[n-1],1)}`).join(', ');
  return `<div class="cc-chart"><div class="cc-chart__box" id="cc-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg><div class="cc-chart__tip" id="cc-tip" hidden></div></div></div>`}
function wireChart(){const box=document.getElementById('cc-chart');if(!box||!chartData)return;const hit=box.querySelector('#cc-hit'),cross=box.querySelector('#cc-cross'),tip=box.querySelector('#cc-tip');const {list,n,x,W,L,R,dayLabel}=chartData;hit.addEventListener('mousemove',e=>{const b=box.getBoundingClientRect();const px=(e.clientX-b.left)/b.width*W;const i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));cross.setAttribute('x1',x(i));cross.setAttribute('x2',x(i));cross.setAttribute('visibility','visible');tip.hidden=false;tip.innerHTML=`<b>${i===n-1?tr('Today','Aujourd’hui'):dayLabel(i)}</b>`+list.map(s=>`<div><span>${esc(s.label)}</span><span>${pct(s.values[i],2)}</span></div>`).join('');const lx=x(i)/W*b.width;tip.style.left=Math.min(Math.max(lx+12,0),b.width-tip.offsetWidth-4)+'px';tip.style.top='8px'});hit.addEventListener('mouseleave',()=>{cross.setAttribute('visibility','hidden');tip.hidden=true})}

  body(st){const gh=`<a class="cc-signin__github" href="#home">${icon('github')}${t('Action_SignIn')}</a>`;return signInCard((st==='refused'?banner('danger','',t('Access.NoRepository')):st==='expired'?banner('warning','',tr('Your session has expired. Sign in again to continue.','Votre session a expiré. Reconnectez-vous pour continuer.')):'')+gh+`<p class="cc-dim cc-small">${tr('You will only see the repositories your GitHub account can read.','Vous ne verrez que les dépôts que votre compte GitHub peut lire.')}</p>`)},
  note:()=>tr('Refused when GitHub lists no installation of an Active organization for the account (Access.NoRepository). The message never says whether an organization is Pending or Suspended.','Refusé quand GitHub ne liste aucune installation d’une organisation Active pour ce compte (Access.NoRepository). Le message ne dit jamais si une organisation est En attente ou Suspendue.')});
const perms=()=>`<dl class="cc-kv"><dt>Contents</dt><dd>${tr('Read','Lecture')}</dd><dt>Pull requests</dt><dd>${tr('Read and write','Lecture et écriture')}</dd><dt>Commit statuses</dt><dd>${tr('Read and write','Lecture et écriture')}</dd><dt>Metadata</dt><dd>${tr('Read','Lecture')}</dd><dt>Organization Members</dt><dd>${tr('Read','Lecture')}</dd><dt>${tr('Events','Événements')}</dt><dd><code>push</code>, <code>pull_request</code>, <code>installation</code>, <code>repository</code>, <code>organization</code>, <code>member</code>, <code>membership</code>, <code>installation_target</code></dd></dl>`;
const step=(cls,n,title,body)=>`<div class="cc-step ${cls}"><span class="cc-step__n">${n}</span><div><h3>${title}</h3>${body}</div></div>`;
reg({id:'setup',group:'access',kind:'bare',layout:'bare',route:()=>'/setup?token=…',plan:['M3.43'],title:()=>tr('First-run setup','Premier démarrage'),states:['default','manual','done','invalidtoken'],
  body(st){if(st==='invalidtoken')return `<div class="cc-setup"><div class="cc-panel"><div class="cc-status-page">${empty('shield',tr('Setup token invalid','Jeton de mise en place invalide'),tr('Use the setup token written in the Web host’s logs at startup.','Utilisez le jeton de mise en place écrit dans les journaux du Web au démarrage.'))}</div></div></div>`;
    const check=icon('check');const url=step('cc-step--done',check,tr('Public addresses','URL publiques'),`<p>https://coverage-api.example.com · https://coverage.example.com</p>`);
    const adm=(c,n)=>step(c,n,tr('Instance administrators','Administrateurs d’instance'),`<p>${tr('Numeric GitHub identifiers of the accounts that administer this instance.','Identifiants GitHub numériques des comptes qui administrent cette instance.')}</p><div style="max-width:360px">${field({label:'Access:AdminUserIds',value:'1204417'})}</div>`);
    let app,head2;
    if(st==='done'){app=step('cc-step--done',check,tr('GitHub App','GitHub App'),`<p>${tr('Created. Accounts that install it stay inert until an instance admin admits them.','Créée. Les comptes qui l’installent restent inertes jusqu’à leur admission par un administrateur d’instance.')}</p>`);head2=adm('cc-step--done',check)}
    else if(st==='manual'){app=step('cc-step--current','2',tr('Enter the GitHub App','Saisir la GitHub App'),`<div class="cc-stack" style="max-width:480px;margin-top:10px">${field({label:'GitHub:AppId',value:'184302'})}${field({label:'GitHub:ClientId',ph:'Iv23…'})}${field({label:'GitHub:ClientSecret',type:'password'})}${field({label:'GitHub:WebhookSecret',type:'password'})}${field({label:'GitHub:PrivateKeyPem',area:true,rows:4})}<div class="cc-cluster">${btn(t('Action_Save'),{v:'primary',attrs:toastAttr(tr('GitHub App saved','GitHub App enregistrée'))})}${btn(tr('Use the manifest','Utiliser le manifest'),{attrs:'data-go-state="default"'})}</div></div>`);head2=adm('','3')}
    else{app=step('cc-step--current','2',tr('Create the GitHub App','Créer la GitHub App'),`<p>${tr('One click creates a public App with the right permissions and webhook. Its credentials come back automatically and are encrypted.','Un clic crée une App publique avec les bonnes permissions et le bon webhook. Ses identifiants reviennent automatiquement et sont chiffrés.')}</p><div class="cc-cluster">${btn(tr('Create the App on GitHub','Créer l’App sur GitHub'),{v:'pill-accent',icon:'github',attrs:'data-go-state="done"'})}${btn(tr('Enter it manually','Saisir manuellement'),{v:'pill',icon:'key',attrs:'data-go-state="manual"'})}</div>`);head2=adm('','3')}
    const total=st==='done'?'3 / 3':'1 / 3';
    return `<div class="cc-setup"><div class="cc-page">${header({title:tr('First-run setup','Premier démarrage'),icon:'rocket',sub:tr('Opened with the setup token from the Web host’s logs. The token is removed when setup completes.','Ouvert avec le jeton de mise en place des journaux du Web. Le jeton est supprimé à la fin de la mise en place.')})}${st==='done'?banner('success',tr('Setup complete','Mise en place terminée'),tr('This instance serves no organization yet: sign in, then admit the first one in Instance.','Cette instance ne sert encore aucune organisation : connectez-vous, puis admettez la première dans Instance.'),btn(t('Action_SignIn'),{small:true,v:'primary',href:'signin'})):''}<div class="cc-grid cc-grid--main">${panel({title:tr('Steps','Étapes'),tools:chip('neutral',total),body:`<div class="cc-stepper">${url}${app}${head2}</div>`})}${panel({title:tr('Requested permissions','Permissions demandées'),body:perms()})}</div></div></div>`},
  note:()=>tr('Installing the App is no longer a step: the setup ends on an instance with no organization (M3.43).','Installer l’App n’est plus une étape : la mise en place se termine sur une instance sans organisation (M3.43).')});

</dt><dd>${tr('Hidden.','Masqué.')}</dd></dl>`})}
      ${panel({title:tr('Second level','Second niveau'),body:`<div class="cc-stack"><div><div class="cc-small cc-muted" style="margin-bottom:6px">${tr('Repository','Dépôt')}</div>${repoTabs('overview')}</div><div><div class="cc-small cc-muted" style="margin-bottom:6px">${t('Nav_Organization')}</div>${orgTabs('org-repositories')}</div><div><div class="cc-small cc-muted" style="margin-bottom:6px">${t('Nav_Instance')}</div>${adminTabs('admin-organizations')}</div></div>`})}</div>`,

/* ---- index ---- */
const GROUPS=[['nav',()=>tr('Navigation','Navigation')],['access',()=>tr('Access and system','Accès et système')],['repos',()=>t('Nav_Repositories')],['repo',()=>tr('Repository','Dépôt')],['account',()=>t('Nav_Account')],['org',()=>t('Nav_Organization')],['instance',()=>t('Nav_Instance')]];
const STATE_LABEL={default:()=>tr('Normal','Nominal'),loading:()=>tr('Loading','Chargement'),error:()=>tr('Error','Erreur'),empty:()=>tr('Empty','Vide'),nomatch:()=>tr('No match','Aucun résultat'),nodata:()=>tr('No report yet','Sans rapport'),notfound:()=>tr('Not found or inaccessible','Introuvable ou inaccessible'),denied:()=>tr('Access denied','Accès refusé'),configerror:()=>tr('Configuration error','Erreur de configuration'),frompull:()=>tr('From a pull request','Depuis une PR'),unavailable:()=>tr('Source unavailable','Source indisponible'),diffincomplete:()=>tr('Incomplete diff','Diff incomplet'),basemissing:()=>tr('Base missing','Base manquante'),invalidrange:()=>tr('Invalid range','Plage invalide'),notcomputed:()=>tr('Not computed','Non calculée'),pending:()=>tr('Comparison pending','Comparaison en attente'),compacted:()=>tr('Compacted','Compacté'),inactive:()=>tr('Inactive','Inactif'),yamlinvalid:()=>tr('Invalid YAML','YAML invalide'),rotation:()=>tr('Rotation advised','Rotation conseillée'),invalid:()=>tr('Invalid value','Valeur invalide'),manual:()=>tr('Manual entry','Saisie manuelle'),done:()=>tr('Complete','Terminé'),invalidtoken:()=>tr('Invalid token','Jeton invalide'),refused:()=>tr('Refused','Refusé'),expired:()=>tr('Session expired','Session expirée'),'dlg-create':()=>tr('Dialog: create','Dialogue : créer'),'dlg-issued':()=>tr('Dialog: value shown once','Dialogue : valeur unique'),'dlg-import':()=>tr('Dialog: import','Dialogue : importer'),'dlg-revoke':()=>tr('Dialog: revoke','Dialogue : révoquer'),'dlg-createapi':()=>tr('Dialog: create','Dialogue : créer'),'dlg-issuedapi':()=>tr('Dialog: value shown once','Dialogue : valeur unique'),'dlg-admit':()=>tr('Dialog: admit','Dialogue : admettre'),'dlg-suspend':()=>tr('Dialog: suspend','Dialogue : suspendre'),'dlg-secret':()=>tr('Dialog: replace a secret','Dialogue : remplacer un secret')};
const indexPage=()=>`<div class="cc-mock-index"><div><h1>${tr('Console mockups','Maquettes de la console')}</h1><p class="cc-mock-index__lead">${tr('Every page of the console, to validate before any of them is built. The bar at the bottom changes the screen, its state, the role, the language, the theme and the width. All accounts and figures are examples.','Toutes les pages de la console, à valider avant d’en construire une seule. La barre du bas change l’écran, son état, le rôle, la langue, le thème et la largeur. Tous les comptes et chiffres sont des exemples.')}</p></div>
  ${GROUPS.map(([g,n])=>panel({title:n(),raw:`<div class="cc-list">${SCREENS.filter(s=>s.group===g).map(s=>`<a class="cc-mock-card" href="#${s.id}"><b>${s.title()}</b><span class="cc-mono cc-small cc-muted">${esc(s.route())}</span><span class="cc-small cc-muted cc-nowrap">${s.plan.join(' · ')} · ${s.states.length} ${tr(s.states.length>1?'states':'state',s.states.length>1?'états':'état')}</span></a>`).join('')}</div>`})).join('')}</div>`;

/* ===================== Rendering, review bar and interactions ===================== */
const app=document.getElementById('app'),dockEl=document.getElementById('dock'),dlgEl=document.getElementById('dialogs'),toasts=document.getElementById('toasts');
function accessOf(s){const p=P_();if(!s.need)return 'ok';if(s.need==='instance')return p.instance?'ok':'denied';if(s.need==='member'||s.need==='repoAdmin'){const m=p.orgs.find(o=>o.login===OWNER);if(!m)return 'notfound';return s.need==='repoAdmin'&&!p.repoAdmin?'denied':'ok'}const org=currentOrg();const m=p.orgs.find(o=>o.login===org);if(!m)return 'notfound';return m.role==='Admin'?'ok':'denied'}
function applyRoot(){const r=document.documentElement;r.lang=S.lang;if(S.theme)r.dataset.theme=S.theme;else delete r.dataset.theme}
function pageHtml(){if(S.screen==='index')return `<div class="cc-mock-app">${indexPage()}</div>`;const s=SCREEN();uid=0;chartData=null;const st=s.states.includes(S.st)?S.st:'default';if(s.layout==='bare')return `<div class="cc-mock-app">${s.body(st)}</div>`;const acc=accessOf(s);let c;if(acc==='denied'||st==='denied')c=deniedPage();else if(acc==='notfound'||st==='notfound')c=inaccessible();else if(st==='loading')c=s.head()+loadingPanel();else if(st==='error')c=s.head()+errorPanel();else c=s.head()+s.body(st);return `<div class="cc-mock-app">${shell(c)}</div>`}
function embedDoc(){const state=JSON.stringify(Object.assign({},S,{width:'desktop'})).replace(/</g,'\\u003c');return '<!doctype html>'+BOOT_HTML.replace(/<head[^>]*>/i,m=>m+'<scr'+'ipt>window.__MOCK_EMBED='+state+'</scr'+'ipt>')}
function render(scroll){applyRoot();dlgEl.innerHTML='';if(S.width==='mobile'&&!EMBED){app.innerHTML=`<div class="cc-mock-device"><iframe id="mock-frame" title="${tr('Mobile width preview','Aperçu en largeur mobile')}"></iframe></div>`;document.getElementById('mock-frame').srcdoc=embedDoc()}else{app.innerHTML=pageHtml();wireChart();const s=SCREEN();if(S.screen!=='index'&&s.dialogs&&s.dialogs[S.st]&&accessOf(s)==='ok')openDialog(s.dialogs[S.st])}renderDock();if(scroll!==false)window.scrollTo(0,0);if(EMBED)try{parent.postMessage({mock:1,screen:S.screen,st:S.st,org:S.org},'*')}catch(e){}}
function renderDock(){if(EMBED){dockEl.innerHTML='';return}const idx=S.screen==='index';const s=idx?null:SCREEN();const groupOpts=GROUPS.map(([g,n])=>`<optgroup label="${esc(n())}">${SCREENS.filter(x=>x.group===g).map(x=>`<option value="${x.id}" ${x.id===S.screen?'selected':''}>${esc(x.title())}</option>`).join('')}</optgroup>`).join('');
  const seg=(name,items,val)=>`<span class="cc-mock-seg" role="group" aria-label="${name}">${items.map(([v,l])=>`<button type="button" data-mock="${name}" data-v="${v}" aria-pressed="${v===val}">${l}</button>`).join('')}</span>`;
  const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  const note=s&&s.note?s.note():'';
  dockEl.innerHTML=`<div class="cc-mock-dock" role="region" aria-label="${tr('Mockup review bar','Barre de revue de la maquette')}" data-collapsed="${S.collapsed}">
    <button type="button" class="cc-mock-btn" data-nav="index" aria-label="${tr('All screens','Tous les écrans')}" title="${tr('All screens','Tous les écrans')}">${icon('list')}</button>
    <button type="button" class="cc-mock-btn" data-nav="prev" aria-label="${tr('Previous screen','Écran précédent')}" title="${tr('Previous screen','Écran précédent')}"><span style="display:inline-flex;transform:rotate(90deg)">${icon('chev')}</span></button>
    <label><span class="cc-sr-only">${tr('Screen','Écran')}</span><select data-mock="screen">${idx?`<option selected>${tr('All screens','Tous les écrans')}</option>`:''}${groupOpts}</select></label>
    <button type="button" class="cc-mock-btn" data-nav="next" aria-label="${tr('Next screen','Écran suivant')}" title="${tr('Next screen','Écran suivant')}"><span style="display:inline-flex;transform:rotate(-90deg)">${icon('chev')}</span></button>
    ${s&&s.states.length>1?`<label><span>${tr('State','État')}</span><select data-mock="state">${s.states.map(x=>`<option value="${x}" ${x===S.st?'selected':''}>${esc(STATE_LABEL[x]())}</option>`).join('')}</select></label>`:''}
    <label class="cc-mock-extra"><span>${tr('Role','Rôle')}</span><select data-mock="persona">${['participant','orgadmin','instance','both'].map(p=>`<option value="${p}" ${p===S.persona?'selected':''}>${esc(personaName(p))}</option>`).join('')}</select></label>
    <span class="cc-mock-extra">${seg('lang',[['fr','FR'],['en','EN']],S.lang)}</span>
    <span class="cc-mock-extra">${seg('theme',[['light',tr('Light','Clair')],['dark',tr('Dark','Sombre')]],dark?'dark':'light')}</span>
    <span class="cc-mock-extra">${seg('width',[['desktop',tr('Desktop','Bureau')],['mobile','Mobile']],S.width)}</span>
    <span class="cc-mock-spacer"></span>
    <button type="button" class="cc-mock-btn" data-nav="collapse" aria-label="${tr('Show or hide the options','Afficher ou masquer les options')}" title="${tr('Show or hide the options','Afficher ou masquer les options')}">${icon(S.collapsed?'plus':'x')}</button>
    ${s?`<div class="cc-mock-note cc-mock-extra"><span class="cc-mock-route">${esc(s.route())}</span> <span class="cc-mock-plan">· ${s.plan.join(' · ')}</span>${note?`<br>${note}`:''}</div>`:''}
  </div>`}
function hashOf(){return S.screen==='index'?'#index':S.st==='default'?'#'+S.screen:`#${S.screen}--${S.st}`}
function fromHash(){const h=location.hash.slice(1);if(!h||h==='index'){S.screen='index';S.st='default';return}const [id,st]=h.split('--');if(SCREENS.some(s=>s.id===id)){S.screen=id;S.st=st||'default'}else if(id==='page'){}else{S.screen='index';S.st='default'}}
function go(id,st){S.screen=id;S.st=st||'default';if(EMBED){render();return}const h=hashOf();if(location.hash===h)render();else location.hash=h}
function toast(tone,title,msg){const el=document.createElement('div');el.className=`cc-toast cc-toast--${tone}`;el.setAttribute('role','status');el.innerHTML=`<span class="cc-toast__icon">${icon(DEF_IC[tone])}</span><div class="cc-toast__body"><strong class="cc-toast__title">${title}</strong>${msg?`<span class="cc-toast__message">${msg}</span>`:''}</div><button type="button" class="cc-toast__close" aria-label="${tr('Dismiss','Fermer')}">${icon('x')}</button>`;el.querySelector('button').onclick=()=>el.remove();toasts.appendChild(el);setTimeout(()=>el.remove(),4200)}
let lastFocus=null;
function openDialog(name,arg){if(!dlgEl.innerHTML)lastFocus=document.activeElement;dlgEl.innerHTML=`<div class="cc-dialog__scrim"><div class="cc-dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT">${DIALOGS[name](arg)}</div></div>`;const f=dlgEl.querySelector('input,select,textarea,button');if(f)f.focus()}
function closeDialog(){dlgEl.innerHTML='';if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.addEventListener('click',e=>{const q=sel=>e.target.closest(sel);let el;
  if((el=q('[data-nav]'))){const v=el.dataset.nav;if(v==='index')go('index');else if(v==='collapse'){S.collapsed=!S.collapsed;renderDock()}else{const i=SCREENS.findIndex(s=>s.id===S.screen);const n=v==='next'?i+1:i-1;go(SCREENS[(n+SCREENS.length)%SCREENS.length].id)}return}
  if((el=q('button[data-mock]'))){const m=el.dataset.mock,v=el.dataset.v;S[m]=v;store.set(m,v);render(false);return}
  if((el=q('[data-theme-toggle]'))){const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);S.theme=dark?'light':'dark';store.set('theme',S.theme);render(false);return}
  if((el=q('[data-usermenu]'))){const p=el.parentElement.querySelector('.cc-user-menu__panel');p.hidden=!p.hidden;el.setAttribute('aria-expanded',String(!p.hidden));return}
  if((el=q('[data-mobile-menu]'))){const n=el.closest('.cc-topnav').querySelector('.cc-topnav__mobile');n.classList.toggle('cc-topnav__mobile--open');el.setAttribute('aria-expanded',String(n.classList.contains('cc-topnav__mobile--open')));return}
  if((el=q('[data-switch]'))){const on=el.classList.toggle('cc-switch--on');el.setAttribute('aria-pressed',String(on));return}
  if((el=q('[data-copy]'))){const pre=el.closest('.cc-copy').querySelector('pre');const done=()=>toast('success',tr('Copied','Copié'));const fb=()=>{const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('neutral',tr('Selected','Sélectionné'),tr('Copy with Ctrl+C.','Copiez avec Ctrl+C.'))};try{navigator.clipboard.writeText(pre.textContent).then(done,fb)}catch(x){fb()}return}
  if((el=q('[data-dialog]'))){openDialog(el.dataset.dialog,el.dataset.arg);return}
  if((el=q('[data-toast]'))){const [a,b]=el.dataset.toast.split('|');toast('success',a,b);if(el.hasAttribute('data-close'))closeDialog();return}
  if((el=q('[data-close]'))){closeDialog();return}
  if((el=q('.cc-dialog__scrim'))&&e.target===el){closeDialog();return}
  if((el=q('[data-go-state]'))){go(S.screen,el.dataset.goState);return}
  if((el=q('[role="tab"]'))){const list=el.closest('[role="tablist"]');list.querySelectorAll('[role="tab"]').forEach(b=>{const on=b===el;b.classList.toggle('cc-folder-tabs__tab--active',on);b.setAttribute('aria-selected',String(on))});
    if(el.dataset.repoFilter)applyRepoFilter();
    if(el.dataset.badgeFormat){document.getElementById('badgeMd').hidden=el.dataset.badgeFormat!=='md';document.getElementById('badgeHtml').hidden=el.dataset.badgeFormat!=='html'}return}
  if((el=q('a[href^="#"]'))){const id=el.getAttribute('href').slice(1);if(id==='page')return;e.preventDefault();go(id);return}
});
function applyRepoFilter(){const q=(document.querySelector('[data-home-search]')||{value:''}).value.toLowerCase();const on=document.querySelector('[data-repo-filter].cc-folder-tabs__tab--active');const f=on?on.dataset.repoFilter:'all';document.querySelectorAll('tbody[id^="home-"] tr').forEach(tr=>{const a=tr.dataset.active==='true';tr.hidden=!((f==='all'||(f==='active'?a:!a))&&tr.textContent.toLowerCase().includes(q))})}
document.addEventListener('input',e=>{const el=e.target;if(el.hasAttribute('data-home-search')){applyRepoFilter();return}if(el.dataset.filter){const b=document.getElementById(el.dataset.filter);if(b)b.querySelectorAll('tr').forEach(r=>{r.hidden=!r.textContent.toLowerCase().includes(el.value.toLowerCase())});return}if(el.hasAttribute('data-filter-settings')){const q=el.value.toLowerCase();document.querySelectorAll('.cc-setting').forEach(r=>{r.hidden=!r.dataset.key.includes(q)})}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.mock==='screen'){go(el.value);return}if(el.dataset.mock==='state'){go(S.screen,el.value);return}if(el.dataset.mock==='persona'){S.persona=el.value;S.org='';store.set('persona',el.value);render(false);return}if(el.dataset.flagToggle){const g=document.querySelector(`g[data-series="${CSS.escape(el.dataset.flagToggle)}"]`);if(g)g.style.display=el.checked?'':'none';return}
  if(el.hasAttribute('data-org-switch')){S.org=el.value;const s=S.screen==='index'?null:SCREEN();if(s&&s.kind==='home'&&s.id==='home'){render(false);return}if(s&&s.kind==='org'&&P_().orgs.some(o=>o.login===S.org&&o.role==='Admin')){render(false);return}go('home')}});
document.addEventListener('keydown',e=>{if(!dlgEl.innerHTML)return;if(e.key==='Escape'){closeDialog();return}if(e.key==='Tab'){const f=[...dlgEl.querySelectorAll('input,select,textarea,button,a[href]')].filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
window.addEventListener('hashchange',()=>{if(EMBED)return;fromHash();render()});
window.addEventListener('message',e=>{if(!e.data||!e.data.mock||EMBED)return;const f=document.getElementById('mock-frame');if(!f||e.source!==f.contentWindow)return;S.screen=e.data.screen;S.st=e.data.st;S.org=e.data.org;history.replaceState(null,'',hashOf());renderDock()});
if(!EMBED)fromHash();
render();

})();
</script>
