# Prometheus of docker-compose.observability.yml: scrapes the collector and evaluates alerts.yml.
# No Alertmanager is configured here: the receiver of the alerts is an operations choice kept out of
# this public repository (docs/operations.md, "Alerts"). The firing alerts are visible on
# http://localhost:9090/alerts.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: codecoverage
    static_configs:
      - targets: ["otel-collector:9464"]
