# ------------------------------------------------------------------------------------------------
# CodeCoverage - production on one VM (M4.02, ARCHITECTURE.md §12.2 and §12.5), PostgreSQL only.
# Images only: no build. The Api and the Web come from the registry of the CI at the TAG of a release;
# Caddy, PostgreSQL and the backup run public images pinned by digest.
#
#   cd deploy/vm
#   cp .env.example .env      # fill in every value
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Update: set the new TAG, then start the Api first (it migrates the schema), then the Web:
#   docker compose -f docker-compose.prod.yml up -d api && docker compose -f docker-compose.prod.yml up -d web
#
# Caddy runs in a container at a fixed address of a network with a fixed subnet, named in
# FORWARDED_KNOWN_PROXIES: the Api and the Web trust its X-Forwarded-* headers and nobody else's.
# Caddyfile.example at the root is the variant for a Caddy installed on the VM itself.
# SQL Server on a VM has no backup recipe here: production on SQL Server goes through Azure SQL (M4.03).
# ------------------------------------------------------------------------------------------------
name: code-coverage

x-bootstrap: &bootstrap
  ConnectionStrings__CodeCoverage: "Host=db;Port=5432;Database=codecoverage;Username=cc;Password=${DB_PASSWORD:?Set DB_PASSWORD}"
  CodeCoverage__Database__Provider: PostgreSql
  ForwardedHeaders__KnownProxies: "172.30.0.10"
  DataProtection__CertificatePath: /run/secrets/dp.pfx
  DataProtection__CertificatePassword: "${DP_CERT_PASSWORD:?Set DP_CERT_PASSWORD}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"

services:
  caddy:
    # caddy:2.10.0-alpine
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    depends_on: [api, web]
    environment:
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
      CC_API_HOST: "${CC_API_HOST:?Set CC_API_HOST}"
      CC_WEB_HOST: "${CC_WEB_HOST:?Set CC_WEB_HOST}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  db:
    # postgres:17-alpine (17.11)
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    environment:
      POSTGRES_DB: codecoverage
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
    volumes:
      - db:/var/lib/postgresql/data
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d codecoverage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-api:${TAG:?Set TAG}
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *bootstrap
      CodeCoverage__Database__MigrateOnStartup: "true"
      # false on a restored copy (the restore drill): its worker would act on the real repositories.
      Worker__Enabled: "${WORKER_ENABLED:-true}"
      Features__EnableApiDocs: "${ENABLE_API_DOCS:-false}"
    secrets: [dp.pfx]
    volumes:
      - api-data:/app/data
    networks: [edge]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-web:${TAG:?Set TAG}
    depends_on:
      api:
        condition: service_started
    environment:
      <<: *bootstrap
    secrets: [dp.pfx]
    volumes:
      - web-data:/app/data
    networks: [edge]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  # pg_dump -Fc every BACKUP_INTERVAL_HOURS into the backups volume, kept BACKUP_RETENTION_DAYS days,
  # unhealthy when the last success is older than 26 hours. The script of backup/ runs in the pinned
  # PostgreSQL image (same major version as the server); backup/Dockerfile bakes the same thing into an
  # image of your registry, if you prefer one. A backup holds every organization of the instance.
  # Off-machine copy: BACKUP_HOOK, a command run on each new dump (its path in $1), e.g. an upload to
  # object storage. Without it, the dumps stay on this VM and do not meet the RPO of ARCHITECTURE §12.5.
  backup:
    image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: cc
      PGDATABASE: codecoverage
      PGPASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-24}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_HOOK: "${BACKUP_HOOK:-}"
    volumes:
      - ./backup:/opt/backup:ro
      - backups:/backups
    networks: [edge]
    healthcheck:
      test: ["CMD", "/bin/sh", "/opt/backup/healthcheck.sh"]
      interval: 5m
      timeout: 10s
      start_period: 10m
      retries: 1
    restart: unless-stopped

secrets:
  # Back it up separately from the database dumps: without it, the stored secrets are unreadable.
  dp.pfx:
    file: ${DP_CERT_FILE:-./secrets/dp.pfx}

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  caddy-data: {}
  caddy-config: {}
  db: {}
  api-data: {}
  web-data: {}
  backups: {}
